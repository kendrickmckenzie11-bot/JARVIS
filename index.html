<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #030303;
    color: #ff2020;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

body {
    background:
        radial-gradient(circle at center, #180000 0%, #050000 42%, #000 100%);
}

/* GRID */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .12;
    background-image:
        linear-gradient(#ff0000 1px, transparent 1px),
        linear-gradient(90deg, #ff0000 1px, transparent 1px);
    background-size: 45px 45px;
}

/* MAIN */

.app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

/* HEADER */

header {
    height: 72px;
    border-bottom: 1px solid #5c0000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    background: rgba(0,0,0,.7);
}

.logo {
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 7px;
    text-shadow: 0 0 15px red;
}

.logo span {
    color: #fff;
}

.header-status {
    font-size: 12px;
    letter-spacing: 2px;
}

.status-light {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ff1717;
    box-shadow: 0 0 12px red;
    margin-right: 8px;
}

/* CONTENT */

.content {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1.4fr 1fr;
    gap: 20px;
    padding: 20px;
    min-height: 0;
}

/* PANELS */

.panel {
    border: 1px solid #570000;
    background: rgba(10,0,0,.65);
    box-shadow:
        inset 0 0 30px rgba(255,0,0,.04),
        0 0 20px rgba(255,0,0,.03);
    padding: 18px;
    min-height: 0;
}

.panel-title {
    font-size: 11px;
    letter-spacing: 3px;
    color: #ff5050;
    border-bottom: 1px solid #420000;
    padding-bottom: 10px;
    margin-bottom: 15px;
}

/* REACTOR */

.center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
}

.reactor {
    width: 250px;
    height: 250px;
    border-radius: 50%;
    border: 2px solid #ff1b1b;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow:
        0 0 20px red,
        0 0 60px rgba(255,0,0,.4),
        inset 0 0 35px rgba(255,0,0,.4);
    animation: reactorPulse 2s infinite ease-in-out;
}

.reactor::before,
.reactor::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    border: 1px solid #ff2a2a;
}

.reactor::before {
    width: 185px;
    height: 185px;
    animation: spin 8s linear infinite;
}

.reactor::after {
    width: 135px;
    height: 135px;
    border-style: dashed;
    animation: spinReverse 5s linear infinite;
}

.core {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #ff1111;
    box-shadow:
        0 0 20px #ff0000,
        0 0 50px #ff0000,
        0 0 100px rgba(255,0,0,.8);
}

@keyframes reactorPulse {
    0%,100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.035);
    }
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@keyframes spinReverse {
    to {
        transform: rotate(-360deg);
    }
}

.listening {
    animation:
        reactorPulse .7s infinite ease-in-out,
        listeningGlow .7s infinite alternate;
}

@keyframes listeningGlow {
    from {
        box-shadow:
            0 0 20px red,
            0 0 60px rgba(255,0,0,.4);
    }
    to {
        box-shadow:
            0 0 45px red,
            0 0 130px rgba(255,0,0,.9);
    }
}

.voice-state {
    margin-top: 25px;
    font-size: 14px;
    letter-spacing: 4px;
}

/* SYSTEM INFO */

.info-row {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #260000;
    padding: 10px 0;
    font-size: 12px;
}

.info-value {
    color: white;
}

/* CONSOLE */

.console {
    position: absolute;
    bottom: 15px;
    left: 20px;
    right: 20px;
    height: 110px;
    border: 1px solid #510000;
    background: rgba(0,0,0,.85);
    padding: 12px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 12px;
}

.console-line {
    margin-bottom: 5px;
}

.console-line.user {
    color: #fff;
}

.console-line.jarvis {
    color: #ff3030;
}

.console-line.system {
    color: #777;
}

/* SETTINGS */

.setting {
    margin-bottom: 15px;
}

.setting label {
    display: block;
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 7px;
}

select,
input[type="text"] {
    width: 100%;
    background: #090000;
    border: 1px solid #650000;
    color: white;
    padding: 10px;
    outline: none;
}

input[type="range"] {
    width: 100%;
    accent-color: red;
}

.name-input {
    margin-bottom: 5px;
}

button {
    background: #100000;
    color: #ff2424;
    border: 1px solid #790000;
    padding: 10px 13px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: .2s;
}

button:hover {
    background: #300000;
    box-shadow: 0 0 15px rgba(255,0,0,.4);
}

.wake-box {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
}

.wake-box input {
    accent-color: red;
}

/* COMMAND BAR */

.command-bar {
    height: 75px;
    border-top: 1px solid #550000;
    background: rgba(0,0,0,.85);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
}

.command-bar input {
    flex: 1;
    height: 44px;
    background: #070000;
    border: 1px solid #640000;
    color: white;
    padding: 0 14px;
    outline: none;
}

.command-bar button {
    height: 44px;
}

/* BOOT SCREEN */

.boot {
    position: fixed;
    z-index: 1000;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 1s;
}

.boot-title {
    font-size: 38px;
    letter-spacing: 10px;
    text-shadow: 0 0 20px red;
}

.boot-text {
    margin-top: 20px;
    font-family: monospace;
    color: #777;
}

.boot-bar {
    margin-top: 25px;
    width: 350px;
    height: 4px;
    background: #220000;
}

.boot-progress {
    width: 0%;
    height: 100%;
    background: red;
    box-shadow: 0 0 15px red;
}

/* MOBILE */

@media(max-width: 850px) {
    body {
        overflow: auto;
    }

    .content {
        grid-template-columns: 1fr;
        overflow-y: auto;
        padding-bottom: 130px;
    }

    .reactor {
        width: 190px;
        height: 190px;
    }

    .console {
        position: relative;
        left: auto;
        right: auto;
        bottom: auto;
        margin-top: 20px;
    }

    .command-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
    }
}
</style>
</head>

<body>

<!-- BOOT -->

<div class="boot" id="boot">
    <div class="boot-title">J.A.R.V.I.S.</div>
    <div class="boot-text" id="bootText">INITIALIZING SYSTEM...</div>

    <div class="boot-bar">
        <div class="boot-progress" id="bootProgress"></div>
    </div>
</div>

<div class="app">

<header>
    <div class="logo">
        J.A.R.V.I.S. <span>// RED PROTOCOL</span>
    </div>

    <div class="header-status">
        <span class="status-light"></span>
        <span id="headerStatus">INITIALIZING</span>
    </div>
</header>

<div class="content">

    <!-- LEFT -->

    <section class="panel">
        <div class="panel-title">SYSTEM TELEMETRY</div>

        <div class="info-row">
            <span>MICROPHONE</span>
            <span class="info-value" id="micStatus">OFFLINE</span>
        </div>

        <div class="info-row">
            <span>RECOGNITION</span>
            <span class="info-value" id="recognitionStatus">STANDBY</span>
        </div>

        <div class="info-row">
            <span>VOICE OUTPUT</span>
            <span class="info-value" id="speechStatus">READY</span>
        </div>

        <div class="info-row">
            <span>WAKE WORD</span>
            <span class="info-value">HEY JARVIS</span>
        </div>

        <div class="info-row">
            <span>CORE</span>
            <span class="info-value">ONLINE</span>
        </div>

        <div class="info-row">
            <span>TIME</span>
            <span class="info-value" id="clock">--:--:--</span>
        </div>
    </section>

    <!-- CENTER -->

    <section class="panel center">

        <div class="reactor" id="reactor">
            <div class="core"></div>
        </div>

        <div class="voice-state" id="voiceState">
            WAITING
        </div>

        <div class="console" id="console"></div>

    </section>

    <!-- RIGHT -->

    <section class="panel">

        <div class="panel-title">JARVIS CONFIGURATION</div>

        <div class="setting">
            <label>YOUR NAME</label>

            <input
                id="userName"
                class="name-input"
                type="text"
                placeholder="Enter your name"
            >

            <button onclick="saveName()">SAVE NAME</button>
        </div>

        <div class="setting">
            <label>JARVIS VOICE</label>

            <select id="voiceSelect"></select>
        </div>

        <div class="setting">
            <label>SPEECH SPEED</label>

            <input
                id="rate"
                type="range"
                min="0.65"
                max="1.3"
                value="0.95"
                step="0.05"
            >
        </div>

        <div class="setting">
            <label>PITCH</label>

            <input
                id="pitch"
                type="range"
                min="0.4"
                max="1.3"
                value="0.75"
                step="0.05"
            >
        </div>

        <div class="setting wake-box">
            <input
                type="checkbox"
                id="wakeMode"
                checked
            >
            <label for="wakeMode">
                REQUIRE "HEY JARVIS"
            </label>
        </div>

        <button onclick="testVoice()">
            TEST VOICE
        </button>

    </section>

</div>

<div class="command-bar">

    <input
        id="commandInput"
        type="text"
        placeholder="Type a command..."
        autocomplete="off"
    >

    <button onclick="executeTypedCommand()">
        EXECUTE
    </button>

    <button onclick="startListening()">
        START MIC
    </button>

</div>

</div>

<script>

/* =========================================================
   JARVIS CORE
========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

const synth = window.speechSynthesis;

let recognition = null;
let voices = [];

let listening = false;
let manuallyStopped = false;
let speaking = false;

let userName =
    localStorage.getItem("jarvisUserName") || "Sir";

const userNameInput =
    document.getElementById("userName");

userNameInput.value = userName;


/* =========================================================
   UI
========================================================= */

const consoleBox =
    document.getElementById("console");

const reactor =
    document.getElementById("reactor");

const voiceState =
    document.getElementById("voiceState");

const micStatus =
    document.getElementById("micStatus");

const recognitionStatus =
    document.getElementById("recognitionStatus");

const speechStatus =
    document.getElementById("speechStatus");

const headerStatus =
    document.getElementById("headerStatus");


function log(type, text) {

    const line =
        document.createElement("div");

    line.className =
        "console-line " + type;

    line.textContent =
        text;

    consoleBox.appendChild(line);

    consoleBox.scrollTop =
        consoleBox.scrollHeight;
}


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    document.getElementById("clock")
        .textContent =
        new Date().toLocaleTimeString();
}

setInterval(updateClock, 1000);
updateClock();


/* =========================================================
   SAVE NAME
========================================================= */

function saveName() {

    const value =
        userNameInput.value.trim();

    if (!value) {
        userName = "Sir";
    } else {
        userName = value;
    }

    localStorage.setItem(
        "jarvisUserName",
        userName
    );

    log(
        "system",
        "User identity updated: " + userName
    );

    speak(
        "Identity updated. I will address you as " +
        userName + "."
    );
}


/* =========================================================
   VOICES
========================================================= */

function loadVoices() {

    voices = synth.getVoices();

    const select =
        document.getElementById("voiceSelect");

    const previous =
        localStorage.getItem("jarvisVoice");

    select.innerHTML = "";

    voices.forEach((voice, index) => {

        const option =
            document.createElement("option");

        option.value = index;

        option.textContent =
            voice.name +
            " (" +
            voice.lang +
            ")";

        select.appendChild(option);
    });

    if (previous) {

        const index =
            voices.findIndex(
                v =>
                    v.name === previous
            );

        if (index >= 0) {
            select.value = index;
        }
    }
}

loadVoices();

if ("onvoiceschanged" in synth) {
    synth.onvoiceschanged =
        loadVoices;
}


/* =========================================================
   INSTANT SPEECH
========================================================= */

function speak(text) {

    if (!text) return;

    /*
       Cancel anything waiting in the speech queue.

       This is important for fast responses.
    */

    synth.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    const select =
        document.getElementById("voiceSelect");

    const selectedVoice =
        voices[select.value];

    if (selectedVoice) {
        utterance.voice =
            selectedVoice;
    }

    utterance.rate =
        Number(
            document.getElementById("rate").value
        );

    utterance.pitch =
        Number(
            document.getElementById("pitch").value
        );

    utterance.volume = 1;

    speaking = true;

    speechStatus.textContent =
        "SPEAKING";

    voiceState.textContent =
        "RESPONDING";

    utterance.onstart = () => {

        speechStatus.textContent =
            "SPEAKING";

        voiceState.textContent =
            "RESPONDING";
    };

    utterance.onend = () => {

        speaking = false;

        speechStatus.textContent =
            "READY";

        voiceState.textContent =
            listening
                ? "LISTENING"
                : "WAITING";
    };

    utterance.onerror = () => {

        speaking = false;

        speechStatus.textContent =
            "READY";
    };

    /*
       Start immediately.
    */

    synth.speak(utterance);
}


/* =========================================================
   WAKE RESPONSE
========================================================= */

function wakeJarvis() {

    const response =
        "Yes, " + userName + "?";

    log(
        "jarvis",
        "JARVIS: " + response
    );

    speak(response);
}


/* =========================================================
   COMMAND ENGINE
========================================================= */

function processCommand(command) {

    command =
        command.trim();

    if (!command) {
        wakeJarvis();
        return;
    }

    log(
        "user",
        "YOU: " + command
    );

    const lower =
        command.toLowerCase();


    /* GREETINGS */

    if (
        lower === "hello" ||
        lower === "hi" ||
        lower === "hello jarvis"
    ) {

        speak(
            "Good to hear from you, " +
            userName + "."
        );

        return;
    }


    /* TIME */

    if (
        lower.includes("what time") ||
        lower === "time"
    ) {

        speak(
            "The current time is " +
            new Date().toLocaleTimeString()
        );

        return;
    }


    /* DATE */

    if (
        lower.includes("what date") ||
        lower.includes("what day") ||
        lower === "date"
    ) {

        speak(
            "Today is " +
            new Date().toLocaleDateString(
                undefined,
                {
                    weekday: "long",
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            )
        );

        return;
    }


    /* STATUS */

    if (
        lower.includes("system status") ||
        lower === "status"
    ) {

        speak(
            "All primary systems are operational. " +
            "Microphone active. Voice recognition active. " +
            "JARVIS core online."
        );

        return;
    }


    /* WHO ARE YOU */

    if (
        lower.includes("who are you") ||
        lower.includes("what are you")
    ) {

        speak(
            "I am JARVIS, your personal browser based artificial intelligence assistant."
        );

        return;
    }


    /* HELP */

    if (
        lower === "help" ||
        lower.includes("what can you do")
    ) {

        speak(
            "I can tell you the time and date, " +
            "search the web, open websites, " +
            "and respond to voice commands."
        );

        return;
    }


    /* THANKS */

    if (
        lower.includes("thank you") ||
        lower.includes("thanks")
    ) {

        speak(
            "You're welcome, " +
            userName + "."
        );

        return;
    }


    /* SEARCH */

    if (
        lower.startsWith("search for ")
    ) {

        const query =
            command.substring(11).trim();

        speak(
            "Searching for " +
            query
        );

        setTimeout(() => {

            window.open(
                "https://www.google.com/search?q=" +
                encodeURIComponent(query),
                "_blank"
            );

        }, 250);

        return;
    }


    if (
        lower.startsWith("google ")
    ) {

        const query =
            command.substring(7).trim();

        speak(
            "Searching Google for " +
            query
        );

        setTimeout(() => {

            window.open(
                "https://www.google.com/search?q=" +
                encodeURIComponent(query),
                "_blank"
            );

        }, 250);

        return;
    }


    /* OPEN WEBSITES */

    const sites = {

        "youtube":
            "https://www.youtube.com",

        "google":
            "https://www.google.com",

        "gmail":
            "https://mail.google.com",

        "google drive":
            "https://drive.google.com",

        "drive":
            "https://drive.google.com",

        "github":
            "https://github.com",

        "apps script":
            "https://script.google.com"
    };


    for (const name in sites) {

        if (
            lower === name ||
            lower.includes("open " + name)
        ) {

            speak(
                "Opening " +
                name
            );

            setTimeout(() => {

                window.open(
                    sites[name],
                    "_blank"
                );

            }, 250);

            return;
        }
    }


    /* SHUTDOWN */

    if (
        lower.includes("stop listening") ||
        lower === "shutdown"
    ) {

        stopListening();

        speak(
            "Voice recognition disabled."
        );

        return;
    }


    /* REBOOT */

    if (
        lower === "reboot" ||
        lower === "restart jarvis"
    ) {

        speak(
            "Restarting JARVIS systems."
        );

        setTimeout(
            runBootSequence,
            1200
        );

        return;
    }


    /* DEFAULT */

    speak(
        "I heard you, " +
        userName +
        ". I don't currently have an action for that command."
    );
}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

function setupRecognition() {

    if (!SpeechRecognition) {

        log(
            "system",
            "Speech recognition is not supported by this browser."
        );

        return;
    }

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-US";

    /*
       CONTINUOUS LISTENING
    */

    recognition.continuous =
        true;

    recognition.interimResults =
        true;

    recognition.maxAlternatives =
        1;


    /* START */

    recognition.onstart = () => {

        listening = true;

        micStatus.textContent =
            "ACTIVE";

        recognitionStatus.textContent =
            "LISTENING";

        headerStatus.textContent =
            "VOICE ACTIVE";

        voiceState.textContent =
            "LISTENING";

        reactor.classList.add(
            "listening"
        );
    };


    /* RESULT */

    recognition.onresult =
        event => {

            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                const result =
                    event.results[i];

                const transcript =
                    result[0].transcript
                        .trim();

                /*
                   Only process FINAL speech.
                */

                if (!result.isFinal) {
                    continue;
                }

                if (!transcript) {
                    continue;
                }

                const wakeMode =
                    document.getElementById(
                        "wakeMode"
                    ).checked;

                const lower =
                    transcript.toLowerCase();


                /*
                   WAKE WORD MODE
                */

                if (wakeMode) {

                    const wakeMatch =
                        lower.match(
                            /\b(?:hey\s+)?jarvis\b/i
                        );

                    if (!wakeMatch) {

                        log(
                            "system",
                            "Heard: " +
                            transcript
                        );

                        continue;
                    }


                    /*
                       Remove:
                       "Jarvis"
                       "Hey Jarvis"
                    */

                    let command =
                        transcript.replace(
                            /^\s*hey\s+jarvis\b/i,
                            ""
                        ).trim();

                    command =
                        command.replace(
                            /^\s*jarvis\b/i,
                            ""
                        ).trim();


                    /*
                       If the user ONLY said:
                       "Hey Jarvis"
                    */

                    if (!command) {

                        wakeJarvis();

                        continue;
                    }


                    /*
                       If they said:
                       "Hey Jarvis, what time is it?"
                    */

                    processCommand(
                        command
                    );

                } else {

                    /*
                       Wake mode disabled.
                       Every final utterance is treated
                       as a command.
                    */

                    processCommand(
                        transcript
                    );
                }
            }
        };


    /* ERROR */

    recognition.onerror =
        event => {

            log(
                "system",
                "Recognition: " +
                event.error
            );

            /*
               Permission errors should not endlessly
               restart.
            */

            if (
                event.error ===
                "not-allowed"
            ) {

                listening = false;

                micStatus.textContent =
                    "BLOCKED";

                headerStatus.textContent =
                    "MIC BLOCKED";

                return;
            }
        };


    /* END */

    recognition.onend =
        () => {

            if (
                manuallyStopped
            ) {

                listening = false;

                micStatus.textContent =
                    "OFFLINE";

                recognitionStatus.textContent =
                    "STANDBY";

                headerStatus.textContent =
                    "STANDBY";

                voiceState.textContent =
                    "WAITING";

                reactor.classList.remove(
                    "listening"
                );

                return;
            }


            /*
               Chrome and other browsers can end a
               recognition session even when continuous
               mode is enabled.

               Restart automatically.
            */

            if (!manuallyStopped) {

                setTimeout(
                    startRecognitionSafely,
                    250
                );
            }
        };
}


/* =========================================================
   SAFE START
========================================================= */

function startRecognitionSafely() {

    if (!recognition) {
        setupRecognition();
    }

    if (!recognition) {
        return;
    }

    try {

        manuallyStopped = false;

        recognition.start();

    } catch (error) {

        /*
           Already running.
           Ignore InvalidStateError.
        */

        if (
            error.name !==
            "InvalidStateError"
        ) {

            log(
                "system",
                "Unable to start microphone."
            );
        }
    }
}


/* =========================================================
   START LISTENING
========================================================= */

function startListening() {

    manuallyStopped =
        false;

    startRecognitionSafely();

    log(
        "system",
        "Continuous microphone mode enabled."
    );
}


/* =========================================================
   STOP LISTENING
========================================================= */

function stopListening() {

    manuallyStopped =
        true;

    if (recognition) {

        try {
            recognition.stop();
        } catch (e) {}
    }

    listening =
        false;

    micStatus.textContent =
        "OFFLINE";

    recognitionStatus.textContent =
        "STANDBY";

    headerStatus.textContent =
        "STANDBY";

    voiceState.textContent =
        "WAITING";

    reactor.classList.remove(
        "listening"
    );
}


/* =========================================================
   TYPED COMMAND
========================================================= */

function executeTypedCommand() {

    const input =
        document.getElementById(
            "commandInput"
        );

    const command =
        input.value.trim();

    if (!command) return;

    input.value = "";

    processCommand(command);
}


document
    .getElementById("commandInput")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                executeTypedCommand();
            }
        }
    );


/* =========================================================
   TEST VOICE
========================================================= */

function testVoice() {

    speak(
        "Voice systems operational. " +
        "How may I assist you, " +
        userName + "?"
    );
}


/* =========================================================
   BOOT SEQUENCE
========================================================= */

function runBootSequence() {

    const boot =
        document.getElementById("boot");

    const text =
        document.getElementById("bootText");

    const progress =
        document.getElementById(
            "bootProgress"
        );

    boot.style.display =
        "flex";

    boot.style.opacity =
        "1";

    const stages = [

        "INITIALIZING JARVIS CORE...",
        "LOADING NEURAL INTERFACE...",
        "CALIBRATING VOICE SYSTEMS...",
        "INITIALIZING MICROPHONE...",
        "LOADING COMMAND ENGINE...",
        "ESTABLISHING VOICE LINK...",
        "ALL SYSTEMS ONLINE."
    ];

    let index = 0;

    const timer =
        setInterval(() => {

            text.textContent =
                stages[index];

            progress.style.width =
                (
                    ((index + 1) /
                    stages.length) * 100
                ) + "%";

            index++;

            if (
                index >=
                stages.length
            ) {

                clearInterval(timer);

                setTimeout(() => {

                    boot.style.opacity =
                        "0";

                    setTimeout(() => {

                        boot.style.display =
                            "none";

                        log(
                            "system",
                            "JARVIS initialized."
                        );

                        setupRecognition();

                        /*
                           Automatically activate the mic
                           after the user has interacted with
                           the page / browser allows it.
                        */

                        startListening();

                    }, 1000);

                }, 600);
            }

        }, 450);
}


/* =========================================================
   INITIALIZE
========================================================= */

window.addEventListener(
    "load",
    () => {

        runBootSequence();
    }
);

</script>
