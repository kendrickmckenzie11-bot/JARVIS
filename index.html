<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>JARVIS</title>


<style>

* {
  box-sizing: border-box;
}


html,
body {

  margin: 0;

  width: 100%;

  height: 100%;

  background: #030303;

  color: #ff1a1a;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  overflow: hidden;

}


body {

  background:
    radial-gradient(
      circle at center,
      #180000 0%,
      #070000 35%,
      #000000 75%
    );

}


#app {

  width: 100%;

  height: 100%;

  position: relative;

  overflow: hidden;

}


#app::before {

  content: "";

  position: absolute;

  inset: 0;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255, 0, 0, 0.025) 0px,
      rgba(255, 0, 0, 0.025) 1px,
      transparent 1px,
      transparent 4px
    );

  pointer-events: none;

  z-index: 100;

}


/* HEADER */

.header {

  position: absolute;

  top: 0;

  left: 0;

  width: 100%;

  height: 70px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 25px;

  border-bottom:
    1px solid
    rgba(255, 0, 0, 0.35);

  background:
    rgba(0, 0, 0, 0.55);

  z-index: 10;

}


.logo {

  font-size: 26px;

  font-weight: bold;

  letter-spacing: 8px;

  text-shadow:
    0 0 8px red,
    0 0 20px
    rgba(255, 0, 0, 0.7);

}


.header-status {

  font-size: 12px;

  letter-spacing: 3px;

  color: #ff5555;

}


/* CENTER */

.center {

  position: absolute;

  left: 50%;

  top: 50%;

  transform:
    translate(-50%, -50%);

  display: flex;

  flex-direction: column;

  align-items: center;

}


.reactor {

  width: 280px;

  height: 280px;

  border-radius: 50%;

  position: relative;

  display: flex;

  align-items: center;

  justify-content: center;

  border:
    2px solid
    rgba(255, 0, 0, 0.7);

  box-shadow:
    0 0 20px
    rgba(255, 0, 0, 0.8),
    0 0 60px
    rgba(255, 0, 0, 0.35),
    inset 0 0 40px
    rgba(255, 0, 0, 0.25);

  animation:
    reactorPulse 2.5s
    infinite ease-in-out;

}


.reactor::before {

  content: "";

  position: absolute;

  width: 220px;

  height: 220px;

  border-radius: 50%;

  border:
    1px dashed
    rgba(255, 50, 50, 0.7);

  animation:
    rotate 12s
    linear infinite;

}


.reactor::after {

  content: "";

  position: absolute;

  width: 150px;

  height: 150px;

  border-radius: 50%;

  border:
    2px solid
    rgba(255, 0, 0, 0.4);

  animation:
    rotateReverse 8s
    linear infinite;

}


.reactor-core {

  width: 90px;

  height: 90px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      #ffffff 0%,
      #ff5555 8%,
      #ff0000 35%,
      #500000 70%,
      transparent 72%
    );

  box-shadow:
    0 0 25px #ff0000,
    0 0 70px
    rgba(255, 0, 0, 0.8);

  animation:
    corePulse 1.4s
    infinite alternate;

}


@keyframes reactorPulse {

  0%,
  100% {

    transform: scale(1);

  }

  50% {

    transform: scale(1.025);

  }

}


@keyframes corePulse {

  from {
    transform: scale(0.9);
  }

  to {
    transform: scale(1.08);
  }

}


@keyframes rotate {

  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }

}


@keyframes rotateReverse {

  from {
    transform: rotate(360deg);
  }

  to {
    transform: rotate(0deg);
  }

}


/* VOICE STATE */

.voice-state {

  margin-top: 25px;

  font-size: 15px;

  letter-spacing: 5px;

  text-shadow:
    0 0 10px red;

  font-weight: bold;

}


.listening-dot {

  display: inline-block;

  width: 8px;

  height: 8px;

  border-radius: 50%;

  background: #ff0000;

  box-shadow:
    0 0 10px red;

  margin-right: 7px;

  animation:
    listeningPulse 1s infinite;

}


@keyframes listeningPulse {

  0%,
  100% {

    opacity: 0.35;

    transform: scale(0.8);

  }

  50% {

    opacity: 1;

    transform: scale(1.3);

  }

}


/* PANELS */

.panel {

  position: absolute;

  top: 100px;

  width: 260px;

  padding: 18px;

  border:
    1px solid
    rgba(255, 0, 0, 0.35);

  background:
    rgba(0, 0, 0, 0.55);

  box-shadow:
    0 0 25px
    rgba(255, 0, 0, 0.08);

  z-index: 5;

}


.panel.left {
  left: 20px;
}


.panel.right {
  right: 20px;
}


.panel-title {

  font-size: 11px;

  letter-spacing: 3px;

  color: #ff5555;

  margin-bottom: 15px;

}


.stat {

  display: flex;

  justify-content: space-between;

  margin: 10px 0;

  font-size: 11px;

  letter-spacing: 1px;

}


.stat span:last-child {

  color: #ff7777;

}


/* CONSOLE */

.console {

  position: absolute;

  bottom: 115px;

  left: 50%;

  transform:
    translateX(-50%);

  width:
    min(800px, 90%);

  height: 130px;

  overflow-y: auto;

  padding: 12px;

  border:
    1px solid
    rgba(255, 0, 0, 0.3);

  background:
    rgba(0, 0, 0, 0.6);

  font-family: monospace;

  font-size: 12px;

  z-index: 8;

}


.console-line {

  margin-bottom: 7px;

}


.console-line.user {

  color: #ffaaaa;

}


.console-line.jarvis {

  color: #ff3333;

}


.console-line.system {

  color: #777;

}


/* COMMAND */

.command-area {

  position: absolute;

  bottom: 25px;

  left: 50%;

  transform:
    translateX(-50%);

  width:
    min(800px, 90%);

  display: flex;

  gap: 8px;

  z-index: 20;

}


.command-area input {

  flex: 1;

  height: 45px;

  padding: 0 15px;

  color: #ff5555;

  background: #050000;

  border:
    1px solid
    rgba(255, 0, 0, 0.5);

  outline: none;

  font-family: monospace;

  font-size: 14px;

}


button {

  height: 45px;

  padding: 0 18px;

  border:
    1px solid red;

  color: #ff4444;

  background: #080000;

  cursor: pointer;

  font-weight: bold;

  letter-spacing: 1px;

}


button:hover {

  background: #240000;

  box-shadow:
    0 0 15px
    rgba(255, 0, 0, 0.5);

}


/* SETTINGS */

.settings {

  position: absolute;

  bottom: 20px;

  right: 20px;

  width: 250px;

  padding: 15px;

  background:
    rgba(0, 0, 0, 0.8);

  border:
    1px solid
    rgba(255, 0, 0, 0.3);

  z-index: 20;

}


.settings label {

  display: block;

  font-size: 10px;

  letter-spacing: 2px;

  margin-top: 10px;

  color: #ff5555;

}


.settings input,
.settings select {

  width: 100%;

  margin-top: 5px;

  background: #050000;

  color: #ff5555;

  border:
    1px solid
    rgba(255, 0, 0, 0.35);

  padding: 7px;

  outline: none;

}


/* BOOT */

#boot {

  position: fixed;

  inset: 0;

  background: #000;

  z-index: 1000;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-direction: column;

}


.boot-title {

  font-size: 42px;

  letter-spacing: 12px;

  text-shadow:
    0 0 15px red,
    0 0 40px red;

  margin-bottom: 30px;

}


.boot-text {

  font-family: monospace;

  font-size: 13px;

  color: #ff4444;

  min-height: 100px;

  text-align: center;

}


.boot-bar {

  width: 300px;

  height: 3px;

  background: #250000;

  margin-top: 20px;

  overflow: hidden;

}


.boot-progress {

  width: 0%;

  height: 100%;

  background: red;

  box-shadow:
    0 0 15px red;

  transition:
    width 0.15s linear;

}


@media (max-width: 800px) {

  .panel {
    display: none;
  }

  .reactor {

    width: 210px;

    height: 210px;

  }

  .reactor::before {

    width: 165px;

    height: 165px;

  }

  .reactor::after {

    width: 115px;

    height: 115px;

  }

  .reactor-core {

    width: 65px;

    height: 65px;

  }

  .settings {
    display: none;
  }

  .console {

    bottom: 105px;

    height: 100px;

  }

  .command-area {

    bottom: 15px;

  }

  .logo {

    font-size: 20px;

  }

}

</style>

</head>


<body>


<div id="app">


  <div class="header">

    <div class="logo">
      JARVIS
    </div>

    <div
      class="header-status"
      id="headerStatus"
    >
      INITIALIZING
    </div>

  </div>


  <div class="panel left">

    <div class="panel-title">
      SYSTEM TELEMETRY
    </div>

    <div class="stat">
      <span>CORE</span>
      <span>ONLINE</span>
    </div>

    <div class="stat">
      <span>VOICE</span>
      <span id="voiceStatus">
        CLOUD TTS
      </span>
    </div>

    <div class="stat">
      <span>MIC</span>
      <span id="micStatus">
        STARTING
      </span>
    </div>

    <div class="stat">
      <span>AI</span>
      <span id="aiStatus">
        ONLINE
      </span>
    </div>

    <div class="stat">
      <span>WAKE WORD</span>
      <span>ACTIVE</span>
    </div>

  </div>


  <div class="panel right">

    <div class="panel-title">
      USER PROFILE
    </div>

    <div class="stat">

      <span>IDENTITY</span>

      <span id="identityDisplay">
        USER
      </span>

    </div>

    <div class="stat">

      <span>MODE</span>

      <span>
        VOICE
      </span>

    </div>

    <div class="stat">

      <span>AI ROUTER</span>

      <span>
        OPENROUTER
      </span>

    </div>

    <div class="stat">

      <span>VOICE ENGINE</span>

      <span>
        GOOGLE TTS
      </span>

    </div>

  </div>


  <div class="center">

    <div class="reactor">

      <div class="reactor-core"></div>

    </div>


    <div
      class="voice-state"
      id="voiceState"
    >

      <span class="listening-dot"></span>

      LISTENING

    </div>

  </div>


  <div
    class="console"
    id="console"
  ></div>


  <div class="settings">

    <label>
      YOUR NAME
    </label>

    <input
      id="nameInput"
      type="text"
      placeholder="Enter your name"
    >

    <button
      id="saveNameButton"
      style="
        width:100%;
        margin-top:8px;
      "
    >
      SAVE NAME
    </button>


    <label>
      VOICE
    </label>

    <select id="voiceSelect">

      <option>
        JARVIS — CHIRP 3 HD CHARON
      </option>

    </select>


    <label>
      SPEECH SPEED
    </label>

    <input
      id="rateControl"
      type="range"
      min="0.80"
      max="1.10"
      step="0.01"
      value="0.96"
    >


    <label>
      PITCH
    </label>

    <input
      id="pitchControl"
      type="range"
      min="-10"
      max="10"
      step="0.5"
      value="-1.5"
    >

  </div>


  <div class="command-area">

    <input
      id="commandInput"
      type="text"
      placeholder="Speak or type a command..."
      autocomplete="off"

    <button id="sendButton">
      SEND
    </button>

    <button id="micButton">
      MIC
    </button>

  </div>

</div>


<div id="boot">

  <div class="boot-title">
    JARVIS
  </div>

  <div
    class="boot-text"
    id="bootText"
  >
    INITIALIZING...
  </div>

  <div class="boot-bar">

    <div
      class="boot-progress"
      id="bootProgress"
    ></div>

  </div>

</div>


<script>


/* =====================================================
   APPS SCRIPT URL
===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/a/macros/students.katyisd.org/s/AKfycbzhkEbxBKBW1BLVnR0IkTbl0kE8xu8c0YQnKbKlLBRfypDRmP8-R-iJ2U66d2CGWHAJvQ/exec";


/* =====================================================
   VARIABLES
===================================================== */

let userName =
  localStorage.getItem(
    "jarvisUserName"
  ) || "Sir";


let speaking =
  false;


let listening =
  false;


let recognition =
  null;


let recognitionAvailable =
  false;


let aiThinking =
  false;


let currentAudio =
  null;


let audioUnlocked =
  false;


/* =====================================================
   ELEMENTS
===================================================== */

const consoleElement =
  document.getElementById(
    "console"
  );


const commandInput =
  document.getElementById(
    "commandInput"
  );


const sendButton =
  document.getElementById(
    "sendButton"
  );


const micButton =
  document.getElementById(
    "micButton"
  );


const nameInput =
  document.getElementById(
    "nameInput"
  );


const saveNameButton =
  document.getElementById(
    "saveNameButton"
  );


const voiceState =
  document.getElementById(
    "voiceState"
  );


const headerStatus =
  document.getElementById(
    "headerStatus"
  );


const micStatus =
  document.getElementById(
    "micStatus"
  );


const aiStatus =
  document.getElementById(
    "aiStatus"
  );


const identityDisplay =
  document.getElementById(
    "identityDisplay"
  );


/* =====================================================
   NAME
===================================================== */

nameInput.value =
  userName;


identityDisplay.textContent =
  userName.toUpperCase();


saveNameButton.addEventListener(
  "click",
  saveName
);


nameInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      saveName();

    }

  }
);


function saveName() {

  const value =
    nameInput.value.trim();


  if (!value) {
    return;
  }


  userName =
    value;


  localStorage.setItem(
    "jarvisUserName",
    userName
  );


  identityDisplay.textContent =
    userName.toUpperCase();


  log(
    "system",
    "User identity updated to " +
    userName +
    "."
  );


  speak(
    "Identity updated. Hello, " +
    userName +
    "."
  );

}


/* =====================================================
   LOGGING
===================================================== */

function log(
  type,
  message
) {

  const line =
    document.createElement(
      "div"
    );


  line.className =
    "console-line " +
    type;


  const time =
    new Date()
      .toLocaleTimeString();


  line.textContent =
    "[" +
    time +
    "] " +
    message;


  consoleElement.appendChild(
    line
  );


  consoleElement.scrollTop =
    consoleElement.scrollHeight;

}


/* =====================================================
   VOICE STATE
===================================================== */

function setVoiceState(
  state
) {

  voiceState.innerHTML =
    '<span class="listening-dot"></span>' +
    state;

}


/* =====================================================
   UNLOCK AUDIO
===================================================== */

function unlockAudio() {

  if (audioUnlocked) {
    return;
  }


  /*
   * Browsers sometimes require the
   * user to interact with the page
   * before audio can play.
   */

  try {

    const audio =
      new Audio();


    audio.volume =
      0;


    audio.play()
      .then(
        function() {

          audio.pause();

          audioUnlocked =
            true;

        }
      )
      .catch(
        function() {}
      );

  }

  catch (error) {}

}


/* =====================================================
   GOOGLE CLOUD VOICE REQUEST
===================================================== */

function requestVoice(
  text
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "__jarvisVoice_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished =
        false;


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished =
              true;


            cleanup();


            reject(
              new Error(
                "Voice request timed out."
              )
            );

          },
          30000
        );


      function cleanup() {

        clearTimeout(
          timeout
        );


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }


        try {

          delete window[
            callbackName
          ];

        }

        catch (error) {

          window[
            callbackName
          ] =
            undefined;

        }

      }


      window[
        callbackName
      ] =
        function(data) {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          if (!data) {

            reject(
              new Error(
                "No voice response."
              )
            );

            return;

          }


          if (!data.success) {

            reject(
              new Error(
                data.error ||
                "Google TTS failed."
              )
            );

            return;

          }


          if (!data.audioContent) {

            reject(
              new Error(
                "No audio was returned."
              )
            );

            return;

          }


          resolve(
            data.audioContent
          );

        };


      const url =
        APPS_SCRIPT_URL +
        "?action=voice" +
        "&callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&text=" +
        encodeURIComponent(
          text
        ) +
        "&t=" +
        Date.now();


      script.src =
        url;


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              "Could not connect to voice server."
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );

}


/* =====================================================
   PLAY GOOGLE TTS AUDIO
===================================================== */

async function speak(
  text
) {

  if (!text) {
    return;
  }


  /*
   * Stop previous audio.
   */

  stopSpeaking();


  speaking =
    true;


  setVoiceState(
    "SPEAKING"
  );


  headerStatus.textContent =
    "JARVIS SPEAKING";


  document.getElementById(
    "voiceStatus"
  ).textContent =
    "GENERATING";


  try {

    const base64 =
      await requestVoice(
        text
      );


    document.getElementById(
      "voiceStatus"
    ).textContent =
      "PLAYING";


    const binary =
      atob(base64);


    const bytes =
      new Uint8Array(
        binary.length
      );


    for (
      let i = 0;
      i < binary.length;
      i++
    ) {

      bytes[i] =
        binary.charCodeAt(i);

    }


    const blob =
      new Blob(
        [bytes],
        {
          type:
            "audio/mpeg"
        }
      );


    const audioURL =
      URL.createObjectURL(
        blob
      );


    currentAudio =
      new Audio(
        audioURL
      );


    currentAudio.volume =
      1;


    currentAudio.playbackRate =
      Number(
        document.getElementById(
          "rateControl"
        ).value
      );


    currentAudio.onended =
      function() {

        URL.revokeObjectURL(
          audioURL
        );


        speaking =
          false;


        currentAudio =
          null;


        document.getElementById(
          "voiceStatus"
        ).textContent =
          "CLOUD TTS";


        if (!aiThinking) {

          setVoiceState(
            "LISTENING"
          );

          headerStatus.textContent =
            "JARVIS ONLINE";

        }

      };


    currentAudio.onerror =
      function() {

        speaking =
          false;

        currentAudio =
          null;

        document.getElementById(
          "voiceStatus"
        ).textContent =
          "ERROR";

        setVoiceState(
          "LISTENING"
        );

        headerStatus.textContent =
          "JARVIS ONLINE";

      };


    await currentAudio.play();

  }

  catch (error) {

    console.error(
      error
    );


    speaking =
      false;


    document.getElementById(
      "voiceStatus"
    ).textContent =
      "ERROR";


    setVoiceState(
      "LISTENING"
    );


    headerStatus.textContent =
      "VOICE ERROR";


    log(
      "system",
      "Voice error: " +
      error.message
    );

  }

}


/* =====================================================
   STOP SPEAKING
===================================================== */

function stopSpeaking() {

  if (currentAudio) {

    try {

      currentAudio.pause();

      currentAudio.currentTime =
        0;

    }

    catch (error) {}

    currentAudio =
      null;

  }


  speaking =
    false;

}


/* =====================================================
   AI REQUEST
===================================================== */

function askJarvisAI(
  message
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "__jarvisAI_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished =
        false;


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished =
              true;


            cleanup();


            reject(
              new Error(
                "JARVIS AI request timed out."
              )
            );

          },
          30000
        );


      function cleanup() {

        clearTimeout(
          timeout
        );


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }


        try {

          delete window[
            callbackName
          ];

        }

        catch (error) {

          window[
            callbackName
          ] =
            undefined;

        }

      }


      window[
        callbackName
      ] =
        function(data) {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          if (!data) {

            reject(
              new Error(
                "No response from JARVIS."
              )
            );

            return;

          }


          if (!data.success) {

            reject(
              new Error(
                data.error ||
                "AI returned an error."
              )
            );

            return;

          }


          resolve(
            data.response
          );

        };


      const url =
        APPS_SCRIPT_URL +
        "?action=ai" +
        "&callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&message=" +
        encodeURIComponent(
          message
        ) +
        "&name=" +
        encodeURIComponent(
          userName
        ) +
        "&t=" +
        Date.now();


      script.src =
        url;


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              "Could not connect to JARVIS backend."
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );

}


/* =====================================================
   COMMAND PROCESSOR
===================================================== */

async function processCommand(
  command
) {

  const original =
    command.trim();


  const text =
    original.toLowerCase();


  if (!original) {
    return;
  }


  unlockAudio();


  log(
    "user",
    "YOU: " +
    original
  );


  /* LOCAL COMMANDS */


  if (
    text === "hello" ||
    text === "hi" ||
    text === "hey"
  ) {

    const response =
      "Good day, " +
      userName +
      ". How may I assist you?";


    log(
      "jarvis",
      "JARVIS: " +
      response
    );


    speak(
      response
    );


    return;

  }


  if (
    text.includes(
      "what time is it"
    ) ||
    text === "time"
  ) {

    const now =
      new Date();


    const time =
      now.toLocaleTimeString(
        [],
        {
          hour:
            "numeric",

          minute:
            "2-digit"
        }
      );


    speak(
      "The current time is " +
      time +
      "."
    );


    return;

  }


  if (
    text.includes(
      "what is today's date"
    ) ||
    text.includes(
      "what day is it"
    ) ||
    text === "date"
  ) {

    const date =
      new Date()
        .toLocaleDateString(
          [],
          {
            weekday:
              "long",

            month:
              "long",

            day:
              "numeric",

            year:
              "numeric"
          }
        );


    speak(
      "Today is " +
      date +
      "."
    );


    return;

  }


  if (
    text.includes(
      "status"
    )
  ) {

    speak(
      "All primary systems are operational. The AI connection and voice system are online."
    );


    return;

  }


  if (
    text.includes(
      "who are you"
    ) ||
    text.includes(
      "what are you"
    )
  ) {

    speak(
      "I am JARVIS, your personal artificial intelligence assistant."
    );


    return;

  }


  if (
    text.includes(
      "thank you"
    ) ||
    text === "thanks"
  ) {

    speak(
      "You're welcome, " +
      userName +
      "."
    );


    return;

  }


  if (
    text === "help" ||
    text.includes(
      "what can you do"
    )
  ) {

    speak(
      "I can answer questions, explain information, open websites, perform searches, and assist you through this interface."
    );


    return;

  }


  /* WEBSITE COMMANDS */


  if (
    text.includes(
      "open youtube"
    )
  ) {

    window.open(
      "https://www.youtube.com",
      "_blank"
    );


    speak(
      "Opening YouTube."
    );


    return;

  }


  if (
    text.includes(
      "open google"
    )
  ) {

    window.open(
      "https://www.google.com",
      "_blank"
    );


    speak(
      "Opening Google."
    );


    return;

  }


  if (
    text.includes(
      "open gmail"
    )
  ) {

    window.open(
      "https://mail.google.com",
      "_blank"
    );


    speak(
      "Opening Gmail."
    );


    return;

  }


  /* SEARCH */


  if (
    text.startsWith(
      "search "
    )
  ) {

    const query =
      original
        .substring(7)
        .trim();


    if (query) {

      window.open(
        "https://www.google.com/search?q=" +
        encodeURIComponent(
          query
        ),
        "_blank"
      );


      speak(
        "Searching for " +
        query +
        "."
      );

    }


    return;

  }


  /* AI */


  await askAI(
    original
  );

}


/* =====================================================
   ASK AI
===================================================== */

async function askAI(
  message
) {

  aiThinking =
    true;


  setVoiceState(
    "THINKING"
  );


  headerStatus.textContent =
    "AI PROCESSING";


  aiStatus.textContent =
    "THINKING";


  try {

    const response =
      await askJarvisAI(
        message
      );


    aiThinking =
      false;


    aiStatus.textContent =
      "ONLINE";


    headerStatus.textContent =
      "JARVIS ONLINE";


    log(
      "jarvis",
      "JARVIS: " +
      response
    );


    await speak(
      response
    );

  }

  catch (error) {

    console.error(
      error
    );


    aiThinking =
      false;


    aiStatus.textContent =
      "ERROR";


    headerStatus.textContent =
      "AI ERROR";


    const errorMessage =
      "I am having trouble connecting to my AI system.";


    log(
      "jarvis",
      "JARVIS: " +
      errorMessage
    );


    speak(
      errorMessage
    );

  }

}


/* =====================================================
   WAKE WORD
===================================================== */

function handleSpeech(
  transcript
) {

  const text =
    transcript
      .toLowerCase()
      .trim();


  if (speaking) {
    return;
  }


  const wakeWords = [
    "hey jarvis",
    "jarvis"
  ];


  let wakeDetected =
    false;


  for (
    const wake of wakeWords
  ) {

    if (
      text.includes(
        wake
      )
    ) {

      wakeDetected =
        true;

      break;

    }

  }


  if (!wakeDetected) {
    return;
  }


  let command =
    text
      .replace(
        "hey jarvis",
        ""
      )
      .replace(
        "jarvis",
        ""
      )
      .trim();


  if (!command) {

    const response =
      "Yes, " +
      userName +
      "?";


    log(
      "user",
      "YOU: Hey JARVIS"
    );


    log(
      "jarvis",
      "JARVIS: " +
      response
    );


    speak(
      response
    );


    return;

  }


  processCommand(
    command
  );

}


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognitionAvailable =
    true;


  recognition =
    new SpeechRecognition();


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.lang =
    "en-US";


  recognition.maxAlternatives =
    1;


  recognition.onstart =
    function() {

      listening =
        true;


      micStatus.textContent =
        "ACTIVE";


      if (!aiThinking &&
          !speaking) {

        setVoiceState(
          "LISTENING"
        );

      }

    };


  recognition.onresult =
    function(event) {

      let finalText =
        "";


      for (
        let i =
          event.resultIndex;

        i <
        event.results.length;

        i++
      ) {

        if (
          event.results[i].isFinal
        ) {

          finalText +=
            event.results[i][0]
              .transcript;

        }

      }


      finalText =
        finalText.trim();


      if (!finalText) {
        return;
      }


      if (speaking) {
        return;
      }


      handleSpeech(
        finalText
      );

    };


  recognition.onerror =
    function(event) {

      console.log(
        "Speech recognition:",
        event.error
      );


      if (
        event.error ===
        "not-allowed" ||
        event.error ===
        "service-not-allowed"
      ) {

        micStatus.textContent =
          "BLOCKED";


        log(
          "system",
          "Microphone permission is blocked."
        );

      }

    };


  recognition.onend =
    function() {

      listening =
        false;


      if (
        recognitionAvailable
      ) {

        setTimeout(
          function() {

            try {

              recognition.start();

            }

            catch (error) {}

          },
          300
        );

      }

    };

}


/* =====================================================
   MICROPHONE
===================================================== */

function startMicrophone() {

  if (!recognitionAvailable) {

    micStatus.textContent =
      "UNSUPPORTED";


    log(
      "system",
      "Speech recognition is not supported."
    );


    return;

  }


  try {

    recognition.start();


    micButton.textContent =
      "MIC ON";


    micStatus.textContent =
      "ACTIVE";


    log(
      "system",
      "Continuous microphone activated."
    );

  }

  catch (error) {

    console.log(
      error
    );

  }

}


micButton.addEventListener(
  "click",
  function() {

    unlockAudio();

    startMicrophone();

  }
);


/* =====================================================
   TEXT INPUT
===================================================== */

sendButton.addEventListener(
  "click",
  function() {

    unlockAudio();


    const command =
      commandInput.value.trim();


    if (!command) {
      return;
    }


    commandInput.value =
      "";


    processCommand(
      command
    );

  }
);


commandInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      sendButton.click();

    }

  }
);


/* =====================================================
   BOOT
===================================================== */

async function bootSequence() {

  const boot =
    document.getElementById(
      "boot"
    );


  const bootText =
    document.getElementById(
      "bootText"
    );


  const progress =
    document.getElementById(
      "bootProgress"
    );


  const messages = [

    "INITIALIZING CORE SYSTEMS...",

    "LOADING NEURAL INTERFACE...",

    "CONNECTING MICROPHONE...",

    "CONNECTING AI ROUTER...",

    "INITIALIZING CLOUD VOICE...",

    "LOADING CHIRP 3 HD VOICE...",

    "CALIBRATING JARVIS AUDIO...",

    "SYSTEMS ONLINE."

  ];


  for (
    let i = 0;

    i < messages.length;

    i++
  ) {

    bootText.textContent =
      messages[i];


    progress.style.width =
      (
        (
          (i + 1) /
          messages.length
        ) *
        100
      ) +
      "%";


    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          220
        )
    );

  }


  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        400
      )
  );


  boot.style.display =
    "none";


  headerStatus.textContent =
    "JARVIS ONLINE";


  log(
    "system",
    "JARVIS initialization complete."
  );


  log(
    "system",
    "Google Cloud voice engine ready."
  );


  log(
    "system",
    "AI connection ready."
  );


  log(
    "system",
    "Wake word: HEY JARVIS."
  );


  /*
   * Start microphone.
   */

  startMicrophone();

}


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "load",
  function() {

    identityDisplay.textContent =
      userName.toUpperCase();


    nameInput.value =
      userName;


    bootSequence();

  }
);
