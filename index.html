<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030303;
    color: #eee;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background:
        radial-gradient(circle at center, #180000 0%, #080000 35%, #020202 75%);
}

/* =====================================================
   MAIN HUD
   ===================================================== */

#hud {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* scanlines */

#hud::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 50;

    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.025) 0px,
        rgba(255,255,255,0.025) 1px,
        transparent 2px,
        transparent 5px
    );
}

/* red glow */

#hud::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 49;

    box-shadow:
        inset 0 0 120px rgba(255,0,0,0.16),
        inset 0 0 30px rgba(255,0,0,0.12);
}

/* =====================================================
   TOP BAR
   ===================================================== */

#topBar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;

    border-bottom: 1px solid rgba(255,0,0,0.35);

    background: rgba(5,0,0,0.75);

    z-index: 20;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 8px;
    color: #fff;
    text-shadow:
        0 0 10px rgba(255,0,0,0.8),
        0 0 25px rgba(255,0,0,0.4);
}

.logo span {
    color: #ff1515;
}

#connectionStatus {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 11px;
    letter-spacing: 3px;
    color: #aaa;
}

.statusDot {
    width: 9px;
    height: 9px;
    border-radius: 50%;

    background: #ff1717;

    box-shadow:
        0 0 8px #ff1717,
        0 0 18px rgba(255,0,0,0.8);

    animation: pulse 1.4s infinite;
}

@keyframes pulse {
    0%,100% {
        opacity: 1;
    }

    50% {
        opacity: .35;
    }
}

/* =====================================================
   LEFT PANEL
   ===================================================== */

#leftPanel {
    position: absolute;
    left: 25px;
    top: 100px;
    bottom: 95px;
    width: 270px;

    border-left: 1px solid rgba(255,0,0,0.25);
    padding-left: 18px;

    z-index: 10;
}

.panelTitle {
    font-size: 10px;
    letter-spacing: 4px;
    color: #ff3030;
    margin-bottom: 16px;
}

.telemetry {
    margin-bottom: 30px;
}

.telemetryRow {
    display: flex;
    justify-content: space-between;

    margin: 12px 0;

    font-size: 11px;
    letter-spacing: 1px;
}

.telemetryValue {
    color: #ff3939;
}

/* =====================================================
   REACTOR
   ===================================================== */

#reactorArea {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 430px;
    height: 430px;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 5;
}

.reactor {
    position: relative;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    border: 1px solid rgba(255,0,0,0.6);

    box-shadow:
        0 0 25px rgba(255,0,0,0.3),
        inset 0 0 35px rgba(255,0,0,0.18);

    animation: reactorRotate 18s linear infinite;
}

@keyframes reactorRotate {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

.reactor::before {
    content: "";

    position: absolute;
    inset: 22px;

    border-radius: 50%;

    border: 2px dashed rgba(255,0,0,0.55);

    box-shadow:
        0 0 20px rgba(255,0,0,0.3);

    animation: reverseRotate 10s linear infinite;
}

@keyframes reverseRotate {
    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

.reactor::after {
    content: "";

    position: absolute;
    inset: 70px;

    border-radius: 50%;

    border: 1px solid rgba(255,40,40,0.9);

    box-shadow:
        0 0 30px rgba(255,0,0,0.5),
        inset 0 0 30px rgba(255,0,0,0.35);
}

.reactorCore {
    position: absolute;

    width: 105px;
    height: 105px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff 0%,
            #ff7777 8%,
            #ff2020 25%,
            #7a0000 55%,
            transparent 72%
        );

    box-shadow:
        0 0 20px #ff2020,
        0 0 60px rgba(255,0,0,0.7),
        0 0 120px rgba(255,0,0,0.35);

    animation: corePulse 1.7s ease-in-out infinite;
}

@keyframes corePulse {
    0%,100% {
        transform: scale(.92);
        opacity: .8;
    }

    50% {
        transform: scale(1.08);
        opacity: 1;
    }
}

#reactorLabel {
    position: absolute;

    bottom: 20px;

    font-size: 10px;
    letter-spacing: 5px;

    color: #ff3030;
}

/* =====================================================
   LISTENING STATE
   ===================================================== */

#listeningState {
    position: absolute;

    left: 50%;
    top: calc(50% + 245px);

    transform: translateX(-50%);

    font-size: 12px;
    letter-spacing: 5px;

    color: #888;

    transition: .25s;
}

body.listening #listeningState {
    color: #ff2525;

    text-shadow:
        0 0 10px #ff0000,
        0 0 25px rgba(255,0,0,.7);
}

body.speaking #listeningState {
    color: #fff;

    text-shadow:
        0 0 10px #ff0000;
}

/* =====================================================
   RIGHT PANEL
   ===================================================== */

#rightPanel {
    position: absolute;

    right: 25px;
    top: 100px;
    bottom: 95px;

    width: 270px;

    border-right: 1px solid rgba(255,0,0,.25);

    padding-right: 18px;

    z-index: 10;
}

.controlGroup {
    margin-bottom: 25px;
}

.controlLabel {
    display: block;

    font-size: 9px;
    letter-spacing: 3px;

    color: #777;

    margin-bottom: 9px;
}

input[type="text"],
select {
    width: 100%;

    padding: 11px;

    color: #eee;

    background: rgba(20,0,0,.8);

    border: 1px solid rgba(255,0,0,.35);

    outline: none;
}

input[type="text"]:focus,
select:focus {
    border-color: #ff2020;

    box-shadow:
        0 0 12px rgba(255,0,0,.2);
}

select option {
    background: #100000;
}

.rangeRow {
    display: flex;
    align-items: center;
    gap: 10px;
}

input[type="range"] {
    width: 100%;
    accent-color: #ff2020;
}

.rangeValue {
    width: 45px;

    text-align: right;

    color: #ff3030;

    font-size: 11px;
}

/* =====================================================
   CONSOLE
   ===================================================== */

#console {
    position: absolute;

    left: 50%;
    bottom: 88px;

    transform: translateX(-50%);

    width: min(700px, 55vw);
    height: 105px;

    overflow-y: auto;

    padding: 12px 15px;

    background: rgba(0,0,0,.55);

    border-top: 1px solid rgba(255,0,0,.2);

    border-bottom: 1px solid rgba(255,0,0,.2);

    font-family: monospace;
    font-size: 11px;

    z-index: 15;
}

.consoleLine {
    margin: 5px 0;

    color: #888;
}

.consoleLine.user {
    color: #ddd;
}

.consoleLine.jarvis {
    color: #ff3636;
}

/* =====================================================
   COMMAND BAR
   ===================================================== */

#commandBar {
    position: absolute;

    left: 50%;
    bottom: 20px;

    transform: translateX(-50%);

    width: min(750px, 75vw);

    display: flex;
    gap: 8px;

    z-index: 25;
}

#commandInput {
    flex: 1;

    height: 48px;

    padding: 0 16px;

    color: white;

    background: rgba(8,0,0,.95);

    border: 1px solid rgba(255,0,0,.5);

    outline: none;

    font-family: monospace;
}

#commandInput::placeholder {
    color: #555;
}

#commandInput:focus {
    border-color: #ff2222;

    box-shadow:
        0 0 15px rgba(255,0,0,.2);
}

.hudButton {
    height: 48px;

    min-width: 110px;

    border: 1px solid #7d0000;

    background: #130000;

    color: #ff3333;

    letter-spacing: 2px;

    cursor: pointer;

    transition: .2s;
}

.hudButton:hover {
    background: #300000;

    border-color: #ff2222;

    box-shadow:
        0 0 15px rgba(255,0,0,.3);
}

.hudButton.active {
    background: #500000;

    color: white;

    box-shadow:
        0 0 20px rgba(255,0,0,.5);
}

/* =====================================================
   BOOT SCREEN
   ===================================================== */

#bootScreen {
    position: fixed;

    inset: 0;

    background: #020202;

    z-index: 1000;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;
}

#bootTitle {
    font-size: 38px;

    letter-spacing: 12px;

    color: white;

    text-shadow:
        0 0 20px rgba(255,0,0,.8);

    margin-bottom: 35px;
}

#bootText {
    width: min(600px, 80vw);

    font-family: monospace;

    color: #ff3030;

    font-size: 12px;

    line-height: 2;

    min-height: 150px;
}

#bootButton {
    padding: 13px 30px;

    background: transparent;

    border: 1px solid #ff2020;

    color: #ff2020;

    cursor: pointer;

    letter-spacing: 4px;

    margin-top: 20px;
}

#bootButton:hover {
    background: #330000;

    box-shadow:
        0 0 20px rgba(255,0,0,.4);
}

#bootScreen.hidden {
    display: none;
}

/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width: 900px) {

    #leftPanel,
    #rightPanel {
        display: none;
    }

    #reactorArea {
        transform: translate(-50%, -55%) scale(.75);
    }

    #listeningState {
        top: calc(50% + 170px);
    }

    #console {
        width: 90vw;
        bottom: 82px;
    }

    #commandBar {
        width: 92vw;
    }

    #topBar {
        padding: 0 15px;
    }

    .logo {
        font-size: 18px;
        letter-spacing: 5px;
    }

    #connectionStatus {
        font-size: 8px;
        letter-spacing: 1px;
    }
}
</style>
</head>

<body>

<div id="hud">

    <!-- =================================================
         TOP BAR
         ================================================= -->

    <div id="topBar">

        <div class="logo">
            JAR<span>V</span>IS
        </div>

        <div id="connectionStatus">
            <div class="statusDot"></div>
            <span id="connectionText">
                SYSTEM ONLINE
            </span>
        </div>

    </div>


    <!-- =================================================
         LEFT TELEMETRY
         ================================================= -->

    <div id="leftPanel">

        <div class="panelTitle">
            SYSTEM TELEMETRY
        </div>

        <div class="telemetry">

            <div class="telemetryRow">
                <span>AI CORE</span>
                <span class="telemetryValue">
                    ONLINE
                </span>
            </div>

            <div class="telemetryRow">
                <span>VOICE ENGINE</span>
                <span class="telemetryValue">
                    ONLINE
                </span>
            </div>

            <div class="telemetryRow">
                <span>OPENROUTER</span>
                <span class="telemetryValue">
                    CONNECTED
                </span>
            </div>

            <div class="telemetryRow">
                <span>MICROPHONE</span>
                <span
                    class="telemetryValue"
                    id="micStatus"
                >
                    STANDBY
                </span>
            </div>

            <div class="telemetryRow">
                <span>LISTEN MODE</span>
                <span
                    class="telemetryValue"
                    id="listenStatus"
                >
                    ACTIVE
                </span>
            </div>

        </div>


        <div class="panelTitle">
            CURRENT USER
        </div>

        <div class="telemetry">

            <div class="telemetryRow">
                <span>IDENTITY</span>
                <span
                    class="telemetryValue"
                    id="userDisplay"
                >
                    USER
                </span>
            </div>

        </div>

    </div>


    <!-- =================================================
         REACTOR
         ================================================= -->

    <div id="reactorArea">

        <div class="reactor">

            <div class="reactorCore"></div>

        </div>

        <div id="reactorLabel">
            JARVIS CORE
        </div>

    </div>


    <div id="listeningState">
        LISTENING
    </div>


    <!-- =================================================
         RIGHT PANEL
         ================================================= -->

    <div id="rightPanel">

        <div class="panelTitle">
            CONFIGURATION
        </div>


        <div class="controlGroup">

            <label class="controlLabel">
                USER NAME
            </label>

            <input
                type="text"
                id="nameInput"
                placeholder="Enter your name"
                autocomplete="off"
            >

        </div>


        <div class="controlGroup">

            <label class="controlLabel">
                JARVIS VOICE
            </label>

            <select id="voiceSelect">

                <option value="eve">
                    Eve
                </option>

                <option value="ara">
                    Ara
                </option>

                <option value="rex">
                    Rex
                </option>

                <option value="sal">
                    Sal
                </option>

                <option value="leo">
                    Leo
                </option>

            </select>

        <div class="controlGroup">

            <label class="controlLabel">
                VOICE SPEED
            </label>

            <div class="rangeRow">

                <input
                    type="range"

                    min="0.5"
                    max="1.5"

        <div class="controlGroup">

            <label class="controlLabel">
                BROWSER FALLBACK PITCH
            </label>

            <div class="rangeRow">

                <input
                    type="range"
                    id="pitchControl"
                    min="0.5"
                    max="2"
                    step="0.05"
                    value="1"
                >

                <span
                    class="rangeValue"
                    id="pitchValue"
                >
                    1.00
                </span>

            </div>

        </div>

    </div>


    <!-- =================================================
         CONSOLE
         ================================================= -->

    <div id="console"></div>


    <!-- =================================================
         COMMAND BAR
         ================================================= -->

    <div id="commandBar">

        <input
            id="commandInput"
            type="text"
            placeholder="Speak or type a command..."
            autocomplete="off"
        >

        <button
            class="hudButton"
            id="sendButton"
        >
            SEND
        </button>

        <button
            class="hudButton"
            id="micButton"
        >
            MIC
        </button>

    </div>

</div>


<!-- =====================================================
     BOOT SCREEN
     ===================================================== -->

<div id="bootScreen">

    <div id="bootTitle">
        JARVIS
    </div>

    <div id="bootText"></div>

    <button id="bootButton">
        INITIALIZE
    </button>

</div>


<script>

/* =====================================================
   APPS SCRIPT BACKEND
   ===================================================== */

const APPS_SCRIPT_URL =
    "https://script.google.com/a/macros/students.katyisd.org/s/AKfycbzhkEbxBKBW1BLVnR0IkTbl0kE8xu8c0YQnKbKlLBRfypDRmP8-R-iJ2U66d2CGWHAJvQ/exec";


/* =====================================================
   GLOBAL VARIABLES
   ===================================================== */

let recognition = null;

let listening = false;

let speaking = false;

let currentAudio = null;

let currentAudioURL = null;

let recognitionRestartTimer = null;

let requestCounter = 0;

let wakeWordDetected = false;

let browserVoices = [];


/* =====================================================
   ELEMENTS
   ===================================================== */

const bootScreen =
    document.getElementById("bootScreen");

const bootText =
    document.getElementById("bootText");

const bootButton =
    document.getElementById("bootButton");

const commandInput =
    document.getElementById("commandInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const consoleElement =
    document.getElementById("console");

const nameInput =
    document.getElementById("nameInput");

const voiceSelect =
    document.getElementById("voiceSelect");

const rateControl =
    document.getElementById("rateControl");

const pitchControl =
    document.getElementById("pitchControl");

const rateValue =
    document.getElementById("rateValue");

const pitchValue =
    document.getElementById("pitchValue");

const userDisplay =
    document.getElementById("userDisplay");

const micStatus =
    document.getElementById("micStatus");

const listenStatus =
    document.getElementById("listenStatus");

const connectionText =
    document.getElementById("connectionText");


/* =====================================================
   USER NAME
   ===================================================== */

let userName =
    localStorage.getItem("jarvisUserName") || "";


if (userName) {

    nameInput.value =
        userName;

    userDisplay.textContent =
        userName.toUpperCase();
}


nameInput.addEventListener(
    "input",
    () => {

        userName =
            nameInput.value.trim();

        localStorage.setItem(
            "jarvisUserName",
            userName
        );

        userDisplay.textContent =
            userName
                ? userName.toUpperCase()
                : "USER";
    }
);


/* =====================================================
   RATE / PITCH
   ===================================================== */

rateControl.addEventListener(
    "input",
    () => {

        rateValue.textContent =
            Number(rateControl.value).toFixed(2);
    }
);


pitchControl.addEventListener(
    "input",
    () => {

        pitchValue.textContent =
            Number(pitchControl.value).toFixed(2);
    }
);


/* =====================================================
   CONSOLE
   ===================================================== */

function addConsole(
    text,
    type = ""
) {

    const line =
        document.createElement("div");

    line.className =
        "consoleLine " + type;

    line.textContent =
        text;

    consoleElement.appendChild(line);

    consoleElement.scrollTop =
        consoleElement.scrollHeight;

    /*
     * Keep console from growing forever.
     */

    while (
        consoleElement.children.length > 40
    ) {

        consoleElement.removeChild(
            consoleElement.firstChild
        );
    }
}


/* =====================================================
   BROWSER VOICES
   ===================================================== */

function loadBrowserVoices() {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }

    browserVoices =
        speechSynthesis.getVoices();
}


if (
    "speechSynthesis" in window
) {

    loadBrowserVoices();

    speechSynthesis.onvoiceschanged =
        loadBrowserVoices;
}


/* =====================================================
   BROWSER SPEECH FALLBACK
   ===================================================== */

function browserSpeak(text) {

    return new Promise(
        resolve => {

            if (
                !("speechSynthesis" in window)
            ) {

                resolve();

                return;
            }


            try {

                speechSynthesis.cancel();


                const utterance =
                    new SpeechSynthesisUtterance(
                        text
                    );


                /*
                 * Try to choose an English voice.
                 */

                const preferred =
                    browserVoices.find(
                        voice =>
                            voice.lang &&
                            voice.lang
                                .toLowerCase()
                                .startsWith("en")
                    );


                if (preferred) {
                    utterance.voice =
                        preferred;
                }


                utterance.rate =
                    Number(rateControl.value);

                utterance.pitch =
                    Number(pitchControl.value);


                utterance.onstart =
                    () => {

                        speaking = true;

                        document.body.classList
                            .add("speaking");
                    };


                utterance.onend =
                    () => {

                        speaking = false;

                        document.body.classList
                            .remove("speaking");

                        resolve();
                    };


                utterance.onerror =
                    () => {

                        speaking = false;

                        document.body.classList
                            .remove("speaking");

                        resolve();
                    };


                speechSynthesis.speak(
                    utterance
                );


            } catch (error) {

                speaking = false;

                document.body.classList
                    .remove("speaking");

                resolve();
            }
        }
    );
}


/* =====================================================
   BASE64 → AUDIO BLOB
   ===================================================== */

function base64ToBlob(
    base64,
    mimeType
) {

    const byteCharacters =
        atob(base64);

    const byteNumbers =
        new Array(
            byteCharacters.length
        );


    for (
        let i = 0;
        i < byteCharacters.length;
        i++
    ) {

        byteNumbers[i] =
            byteCharacters.charCodeAt(i);
    }


    const byteArray =
        new Uint8Array(
            byteNumbers
        );


    return new Blob(
        [byteArray],
        {
            type:
                mimeType || "audio/mpeg"
        }
    );
}


/* =====================================================
   OPENROUTER VOICE
   ===================================================== */

function speakWithOpenRouter(
    text
) {

    return new Promise(
        (resolve, reject) => {

            const callbackName =
                "jarvisTTS_" +
                Date.now() +
                "_" +
                (++requestCounter);


            const voice =
                voiceSelect.value || "eve";


            const speed =
                Number(rateControl.value) || 1;


            const script =
                document.createElement("script");


            let finished = false;


            const cleanup =
                () => {

                    if (script.parentNode) {

                        script.parentNode
                            .removeChild(script);
                    }

                    try {

                        delete window[
                            callbackName
                        ];

                    } catch (e) {}

                    if (timeout) {
                        clearTimeout(timeout);
                    }
                };


            const finish =
                (success, value) => {

                    if (finished) {
                        return;
                    }

                    finished = true;

                    cleanup();

                    if (success) {
                        resolve(value);
                    } else {
                        reject(value);
                    }
                };


            window[callbackName] =
                async function(data) {

                    if (
                        !data ||
                        !data.success ||
                        !data.audio
                    ) {

                        finish(
                            false,
                            new Error(
                                data &&
                                data.error
                                    ? data.error
                                    : "TTS request failed."
                            )
                        );

                        return;
                    }


                    try {

                        const blob =
                            base64ToBlob(
                                data.audio,
                                data.mimeType ||
                                "audio/mpeg"
                            );


                        if (currentAudio) {

                            try {
                                currentAudio.pause();
                            } catch (e) {}

                            currentAudio = null;
                        }


                        if (currentAudioURL) {

                            URL.revokeObjectURL(
                                currentAudioURL
                            );

                            currentAudioURL =
                                null;
                        }


                        currentAudioURL =
                            URL.createObjectURL(
                                blob
                            );


                        const audio =
                            new Audio(
                                currentAudioURL
                            );


                        currentAudio =
                            audio;


                        audio.preload =
                            "auto";


                        audio.onplay =
                            () => {

                                speaking = true;

                                document.body
                                    .classList
                                    .add("speaking");
                            };


                        audio.onended =
                            () => {

                                speaking = false;

                                document.body
                                    .classList
                                    .remove("speaking");


                                if (
                                    currentAudioURL
                                ) {

                                    URL.revokeObjectURL(
                                        currentAudioURL
                                    );

                                    currentAudioURL =
                                        null;
                                }


                                currentAudio =
                                    null;
                            };


                        audio.onerror =
                            () => {

                                speaking = false;

                                document.body
                                    .classList
                                    .remove("speaking");

                                currentAudio =
                                    null;

                                finish(
                                    false,
                                    new Error(
                                        "Audio playback failed."
                                    )
                                );
                            };


                        try {

                            await audio.play();

                            finish(
                                true,
                                true
                            );

                        } catch (playError) {

                            finish(
                                false,
                                playError
                            );
                        }


                    } catch (error) {

                        finish(
                            false,
                            error
                        );
                    }
                };


            /*
             * Encode every query parameter.
             */

            const url =
                APPS_SCRIPT_URL +
                "?tts=1" +
                "&callback=" +
                encodeURIComponent(
                    callbackName
                ) +
                "&voice=" +
                encodeURIComponent(
                    voice
                ) +
                "&speed=" +
                encodeURIComponent(
                    speed
                ) +
                "&text=" +
                encodeURIComponent(
                    text.substring(
                        0,
                        15000
                    )
                ) +
                "&t=" +
                Date.now();


            script.src =
                url;


            script.async =
                true;


            script.onerror =
                () => {

                    finish(
                        false,
                        new Error(
                            "Could not connect to the voice server."
                        )
                    );
                };


            document.body.appendChild(
                script
            );


            /*
             * Prevent a request from hanging forever.
             */

            const timeout =
                setTimeout(
                    () => {

                        finish(
                            false,
                            new Error(
                                "Voice request timed out."
                            )
                        );

                    },
                    30000
                );
        }
    );
}


/* =====================================================
   MAIN SPEAK FUNCTION
   ===================================================== */

async function speak(text) {

    if (!text) {
        return;
    }


    text =
        String(text).trim();


    if (!text) {
        return;
    }


    /*
     * Stop any previous speech.
     */

    if (
        "speechSynthesis" in window
    ) {

        speechSynthesis.cancel();
    }


    if (currentAudio) {

        try {
            currentAudio.pause();
        } catch (e) {}

        currentAudio =
            null;
    }


    /*
     * Mark ourselves as speaking immediately.
     * This prevents the microphone from treating
     * JARVIS's own voice as a command.
     */

    speaking = true;

    document.body.classList
        .add("speaking");


    try {

        await speakWithOpenRouter(
            text
        );


    } catch (error) {

        console.warn(
            "OpenRouter TTS failed:",
            error
        );


        /*
         * If the online voice fails, use the
         * browser's built-in speech system.
         */

        await browserSpeak(
            text
        );
    }


    speaking = false;

    document.body.classList
        .remove("speaking");
}


/* =====================================================
   JSONP AI REQUEST
   ===================================================== */

function askJarvisAI(
    message
) {

    return new Promise(
        (resolve, reject) => {

            const callbackName =
                "jarvisAI_" +
                Date.now() +
                "_" +
                (++requestCounter);


            const script =
                document.createElement("script");


            let finished =
                false;


            const cleanup =
                () => {

                    if (script.parentNode) {

                        script.parentNode
                            .removeChild(script);
                    }


                    try {

                        delete window[
                            callbackName
                        ];

                    } catch (e) {}


                    if (timeout) {

                        clearTimeout(
                            timeout
                        );
                    }
                };


            const finish =
                (success, value) => {

                    if (finished) {
                        return;
                    }

                    finished = true;

                    cleanup();

                    if (success) {
                        resolve(value);
                    } else {
                        reject(value);
                    }
                };


            window[callbackName] =
                function(data) {

                    if (
                        data &&
                        data.success &&
                        data.response
                    ) {

                        finish(
                            true,
                            data.response
                        );

                    } else {

                        finish(
                            false,
                            new Error(
                                data &&
                                data.error
                                    ? data.error
                                    : "AI request failed."
                            )
                        );
                    }
                };


            const url =
                APPS_SCRIPT_URL +
                "?callback=" +
                encodeURIComponent(
                    callbackName
                ) +
                "&message=" +
                encodeURIComponent(
                    message.substring(
                        0,
                        4000
                    )
                ) +
                "&name=" +
                encodeURIComponent(
                    userName || "Sir"
                ) +
                "&t=" +
                Date.now();


            script.src =
                url;


            script.async =
                true;


            script.onerror =
                () => {

                    finish(
                        false,
                        new Error(
                            "Could not connect to JARVIS AI."
                        )
                    );
                };


            document.body.appendChild(
                script
            );


            const timeout =
                setTimeout(
                    () => {

                        finish(
                            false,
                            new Error(
                                "AI request timed out."
                            )
                        );

                    },
                    30000
                );
        }
    );
}


/* =====================================================
   LOCAL COMMANDS
   ===================================================== */

function localCommand(
    text
) {

    const lower =
        text.toLowerCase().trim();


    /* TIME */

    if (
        lower === "time" ||
        lower.includes("what time is it") ||
        lower.includes("what's the time")
    ) {

        return (
            "The current time is " +
            new Date()
                .toLocaleTimeString()
        );
    }


    /* DATE */

    if (
        lower === "date" ||
        lower.includes("what is the date") ||
        lower.includes("what's the date") ||
        lower.includes("what day is it")
    ) {

        return (
            "Today is " +
            new Date()
                .toLocaleDateString(
                    undefined,
                    {
                        weekday: "long",
                        year: "numeric",
                        month: "long",
                        day: "numeric"
                    }
                )
        );
    }


    /* GREETINGS */

    if (
        lower === "hello" ||
        lower === "hi" ||
        lower === "hello jarvis" ||
        lower === "hi jarvis"
    ) {

        return (
            "Good day. How may I assist you?"
        );
    }


    /* WHO ARE YOU */

    if (
        lower.includes("who are you") ||
        lower.includes("what are you")
    ) {

        return (
            "I am JARVIS, your browser-based personal AI assistant."
        );
    }


    /* THANKS */

    if (
        lower === "thanks" ||
        lower === "thank you"
    ) {

        return "You're welcome.";
    }


    /* STATUS */

    if (
        lower === "status" ||
        lower.includes("system status")
    ) {

        return (
            "All primary JARVIS systems are operational."
        );
    }


    /* OPEN YOUTUBE */

    if (
        lower === "open youtube" ||
        lower.includes("open youtube")
    ) {

        window.open(
            "https://www.youtube.com",
            "_blank"
        );

        return "Opening YouTube.";
    }


    /* OPEN GOOGLE */

    if (
        lower === "open google" ||
        lower.includes("open google")
    ) {

        window.open(
            "https://www.google.com",
            "_blank"
        );

        return "Opening Google.";
    }


    /* OPEN GMAIL */

    if (
        lower === "open gmail" ||
        lower.includes("open gmail")
    ) {

        window.open(
            "https://mail.google.com",
            "_blank"
        );

        return "Opening Gmail.";
    }


    /* OPEN DRIVE */

    if (
        lower === "open drive" ||
        lower.includes("open google drive")
    ) {

        window.open(
            "https://drive.google.com",
            "_blank"
        );

        return "Opening Google Drive.";
    }


    /* GOOGLE SEARCH */

    if (
        lower.startsWith("search for ")
    ) {

        const query =
            text.substring(
                11
            ).trim();


        if (query) {

            window.open(
                "https://www.google.com/search?q=" +
                encodeURIComponent(
                    query
                ),
                "_blank"
            );


            return (
                "Searching Google for " +
                query +
                "."
            );
        }
    }


    if (
        lower.startsWith("google ")
    ) {

        const query =
            text.substring(
                7
            ).trim();


        if (query) {

            window.open(
                "https://www.google.com/search?q=" +
                encodeURIComponent(
                    query
                ),
                "_blank"
            );


            return (
                "Searching Google for " +
                query +
                "."
            );
        }
    }


    /* HELP */

    if (
        lower === "help" ||
        lower.includes("what can you do")
    ) {

        return (
            "I can answer questions, search the web through supported commands, open websites, tell you the time and date, and operate the JARVIS interface."
        );
    }


    return null;
}


/* =====================================================
   PROCESS USER COMMAND
   ===================================================== */

async function processUserCommand(
    text
) {

    if (!text) {
        return;
    }


    text =
        text.trim();


    if (!text) {
        return;
    }


    addConsole(
        "USER: " + text,
        "user"
    );


    /*
     * Check local commands first.
     */

    const localResponse =
        localCommand(text);


    if (localResponse) {

        addConsole(
            "JARVIS: " +
            localResponse,
            "jarvis"
        );


        await speak(
            localResponse
        );


        return;
    }


    /*
     * Otherwise send it to OpenRouter.
     */

    connectionText.textContent =
        "AI PROCESSING";


    try {

        const response =
            await askJarvisAI(
                text
            );


        addConsole(
            "JARVIS: " +
            response,
            "jarvis"
        );


        connectionText.textContent =
            "SYSTEM ONLINE";


        await speak(
            response
        );


    } catch (error) {

        console.error(error);


        connectionText.textContent =
            "CONNECTION ERROR";


        const fallback =
            "I am having trouble reaching my AI core right now.";


        addConsole(
            "JARVIS: " +
            fallback,
            "jarvis"
        );


        await speak(
            fallback
        );


        setTimeout(
            () => {

                connectionText.textContent =
                    "SYSTEM ONLINE";

            },
            3000
        );
    }
}


/* =====================================================
   WAKE WORD
   ===================================================== */

function handleSpeech(
    transcript
) {

    if (!transcript) {
        return;
    }


    const text =
        transcript.trim();


    const lower =
        text.toLowerCase();


    /*
     * Ignore our own voice.
     */

    if (speaking) {
        return;
    }


    /*
     * Look for:
     *
     * "hey jarvis"
     * "hey jarvis what's the weather"
     * "jarvis ..."
     */

    let wakeIndex =
        lower.indexOf(
            "hey jarvis"
        );


    let wakeLength =
        "hey jarvis".length;


    if (wakeIndex === -1) {

        wakeIndex =
            lower.indexOf(
                "jarvis"
            );

        wakeLength =
            "jarvis".length;
    }


    /*
     * No wake word.
     */

    if (wakeIndex === -1) {
        return;
    }


    const afterWake =
        text
            .substring(
                wakeIndex + wakeLength
            )
            .trim();


    /*
     * Wake word only:
     *
     * Hey JARVIS
     *
     * → Yes, Kendrick?
     */

    if (!afterWake) {

        const name =
            userName || "Sir";


        addConsole(
            "WAKE WORD DETECTED",
            "user"
        );


        speak(
            "Yes, " +
            name +
            "?"
        );


        return;
    }


    /*
     * Wake word + command.
     */

    wakeWordDetected =
        true;


    processUserCommand(
        afterWake
    );
}


/* =====================================================
   SPEECH RECOGNITION
   ===================================================== */

function setupRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        micStatus.textContent =
            "UNSUPPORTED";

        listenStatus.textContent =
            "TYPE MODE";

        addConsole(
            "Speech recognition is not supported by this browser."
        );

        return;
    }


    recognition =
        new SpeechRecognition();


    recognition.continuous =
        true;


    recognition.interimResults =
        false;


    recognition.lang =
        "en-US";


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        () => {

            listening = true;

            micStatus.textContent =
                "ACTIVE";

            listenStatus.textContent =
                "LISTENING";

            micButton.classList
                .add("active");

            document.body.classList
                .add("listening");
        };


    recognition.onresult =
        event => {

            for (
                let i =
                    event.resultIndex;

                i <
                    event.results.length;

                i++
            ) {

                if (
                    event.results[i]
                        .isFinal
                ) {

                    const transcript =
                        event.results[i][0]
                            .transcript;


                    if (
                        transcript &&
                        transcript.trim()
                    ) {

                        handleSpeech(
                            transcript
                        );
                    }
                }
            }
        };


    recognition.onerror =
        event => {

            console.warn(
                "Speech recognition:",
                event.error
            );


            if (
                event.error ===
                    "not-allowed" ||
                event.error ===
                    "service-not-allowed"
            ) {

                micStatus.textContent =
                    "BLOCKED";

                listenStatus.textContent =
                    "MIC BLOCKED";

                return;
            }
        };


    recognition.onend =
        () => {

            listening = false;


            micButton.classList
                .remove("active");


            document.body.classList
                .remove("listening");


            /*
             * Automatically restart.
             *
             * This gives JARVIS its
             * continuous-listening behavior.
             */

            if (
                !speaking &&
                !recognitionRestartTimer
            ) {

                recognitionRestartTimer =
                    setTimeout(
                        () => {

                            recognitionRestartTimer =
                                null;

                            startListening();

                        },
                        500
                    );
            }
        };
}


/* =====================================================
   START LISTENING
   ===================================================== */

function startListening() {

    if (!recognition) {
        return;
    }


    if (listening) {
        return;
    }


    try {

        recognition.start();

    } catch (error) {

        /*
         * Chrome can throw if start()
         * happens while it is already
         * starting.
         */

        console.warn(
            "Recognition start:",
            error
        );
    }
}


/* =====================================================
   STOP LISTENING
   ===================================================== */

function stopListening() {

    if (!recognition) {
        return;
    }


    try {

        recognition.stop();

    } catch (error) {}
}


/* =====================================================
   MIC BUTTON
   ===================================================== */

micButton.addEventListener(
    "click",
    () => {

        if (!recognition) {

            setupRecognition();
        }


        if (listening) {

            stopListening();

            micStatus.textContent =
                "STANDBY";

            listenStatus.textContent =
                "PAUSED";

        } else {

            startListening();
        }
    }
);


/* =====================================================
   SEND BUTTON
   ===================================================== */

sendButton.addEventListener(
    "click",
    () => {

        const text =
            commandInput.value.trim();


        if (!text) {
            return;
        }


        commandInput.value =
            "";


        processUserCommand(
            text
        );
    }
);


/* =====================================================
   ENTER KEY
   ===================================================== */

commandInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendButton.click();
        }
    }
);

const bootLines = [

    "JARVIS CORE INITIALIZING...",
    "LOADING NEURAL INTERFACE...",
    "CONNECTING TO OPENROUTER...",
    "LOADING VOICE SYSTEM...",
    "INITIALIZING SPEECH RECOGNITION...",
    "CALIBRATING REACTOR CORE...",
    "VOICE SYNTHESIS READY.",
    "AI CORE READY.",
    "ALL PRIMARY SYSTEMS ONLINE."
];


let bootIndex =
    0;


function runBoot() {

    bootText.innerHTML =
        "";


    function nextLine() {

        if (
            bootIndex >=
            bootLines.length
        ) {

            bootButton.style.display =
                "block";

            return;
        }


        const line =
            document.createElement(
                "div"
            );


        line.textContent =
            "> " +
            bootLines[
                bootIndex
            ];


        bootText.appendChild(
            line
        );


        bootIndex++;


        setTimeout(
            nextLine,
            300
        );
    }


    nextLine();
}


bootButton.addEventListener(
    "click",
    async () => {

        bootScreen.classList
            .add("hidden");


        addConsole(
            "JARVIS INITIALIZED."
        );

            "VOICE ENGINE: OPENROUTER TTS"
        );

         */

        if (!recognition) {

        }


        startListening();

         */

        const name =
            userName || "Sir";


        await speak(

            name +
            "."
        );
    }
);
