<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. // RED PROTOCOL</title>

<style>
* { box-sizing: border-box; }

:root {
    --red: #ff1738;
    --red2: #ff5367;
    --black: #020203;
    --panel: #0a0a0d;
    --white: #f5f5f5;
    --gray: #85858c;
}

html, body {
    margin: 0;
    min-height: 100%;
    background: var(--black);
    color: var(--white);
    font-family: "Courier New", monospace;
}

body {
    overflow-x: hidden;
}

/* BACKGROUND GRID */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background:
        linear-gradient(rgba(255,23,56,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,23,56,.035) 1px, transparent 1px);

    background-size: 42px 42px;
}

/* SCANLINES */
.scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .06;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            white 4px
        );
}

/* APP */
.app {
    width: min(1250px, 94vw);
    margin: auto;
    padding: 28px 0 40px;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    border-bottom: 1px solid rgba(255,23,56,.35);
    padding-bottom: 16px;
}

.logo {
    font-size: clamp(25px, 5vw, 48px);
    letter-spacing: 8px;
    font-weight: bold;

    text-shadow:
        0 0 12px var(--red),
        0 0 30px rgba(255,23,56,.4);
}

.tag {
    text-align: right;
    color: var(--gray);
    font-size: 11px;
    letter-spacing: 3px;
}

.badge {
    display: inline-block;
    margin-top: 6px;
    padding: 4px 7px;

    border: 1px solid rgba(255,23,56,.4);

    color: var(--red2);
    font-size: 9px;
    letter-spacing: 1px;
}

/* LAYOUT */
.main {
    display: grid;
    grid-template-columns: 1fr 330px;
    gap: 20px;

    margin-top: 20px;
}

.panel {
    background:
        linear-gradient(
            145deg,
            rgba(20,20,23,.97),
            rgba(6,6,8,.97)
        );

    border: 1px solid rgba(255,23,56,.35);

    box-shadow:
        0 0 35px rgba(255,0,40,.06),
        inset 0 0 35px rgba(255,0,40,.025);

    padding: 22px;
}

/* MAIN CENTER */
.center {
    text-align: center;

    min-height: 650px;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* REACTOR */
.orb {
    width: 235px;
    height: 235px;

    border-radius: 50%;

    margin: 0 auto 28px;

    border: 2px solid var(--red);

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #ffb1ba 6%,
            #ff304c 16%,
            #7d0017 40%,
            rgba(40,0,7,.35) 62%,
            transparent 70%
        );

    box-shadow:
        0 0 22px var(--red),
        0 0 90px rgba(255,0,40,.35),
        inset 0 0 35px rgba(255,255,255,.15);

    animation: pulse 2.2s infinite;

    position: relative;
}

.orb::after {
    content: "";

    position: absolute;
    inset: 12%;

    border: 1px solid rgba(255,120,130,.4);

    border-radius: 50%;

    animation: spin 8s linear infinite;
}

.listening .orb {
    animation: pulseFast .7s infinite;
}

@keyframes pulse {
    0%,100% {
        transform: scale(.96);
        filter: brightness(.9);
    }

    50% {
        transform: scale(1.04);
        filter: brightness(1.2);
    }
}

@keyframes pulseFast {
    50% {
        transform: scale(1.1);
        filter: brightness(1.7);
    }
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* STATUS */
.status {
    color: #ff6678;
    letter-spacing: 4px;
    font-size: 12px;

    margin-bottom: 20px;
}

#result {
    min-height: 62px;

    line-height: 1.6;

    color: #eee;

    margin-bottom: 24px;
}

/* BUTTONS */
.controls {
    display: flex;
    gap: 10px;

    justify-content: center;
    flex-wrap: wrap;
}

button {
    border: 1px solid var(--red);

    background: rgba(255,23,56,.06);

    color: white;

    padding: 13px 18px;

    font-family: inherit;
    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;

    transition: .15s;
}

button:hover {
    background: rgba(255,23,56,.18);

    box-shadow:
        0 0 18px rgba(255,23,56,.25);
}

.primary {
    background: var(--red);
    color: #080808;
}

.primary:hover {
    background: #ff3653;
}

/* INPUT */
input,
select {
    width: 100%;

    background: #070709;

    color: white;

    border: 1px solid rgba(255,23,56,.35);

    padding: 12px;

    font-family: inherit;

    outline: none;
}

input:focus,
select:focus {
    border-color: var(--red);

    box-shadow:
        0 0 10px rgba(255,23,56,.12);
}

.field {
    margin-bottom: 16px;
}

label {
    display: block;

    color: #a6a6ad;

    font-size: 10px;

    letter-spacing: 2px;

    margin-bottom: 7px;
}

/* HEADINGS */
h2 {
    font-size: 13px;

    letter-spacing: 3px;

    color: var(--red2);

    margin: 0 0 20px;
}

/* LOG */
.log {
    height: 245px;

    overflow: auto;

    border: 1px solid rgba(255,23,56,.18);

    padding: 12px;

    background: #040405;

    font-size: 11px;

    line-height: 1.7;
}

.log div {
    margin-bottom: 7px;
}

.you {
    color: #ff7180;
}

.jarvis {
    color: #eee;
}

.sys {
    color: #777;
}

.small {
    font-size: 10px;

    color: #666;

    line-height: 1.6;

    margin-top: 12px;
}

/* MOBILE */
@media(max-width:850px) {

    .main {
        grid-template-columns: 1fr;
    }

    .center {
        min-height: 560px;
    }
}
</style>
</head>

<body>

<div class="scanlines"></div>

<div class="app">

<header>

    <div class="logo">
        J.A.R.V.I.S.
    </div>

    <div class="tag">
        RED PROTOCOL<br>

        <span class="badge">
            BROWSER AI INTERFACE
        </span>
    </div>

</header>


<div class="main">

<!-- MAIN JARVIS PANEL -->

<section class="panel center" id="mainPanel">

    <div class="orb"></div>

    <div class="status" id="status">
        SYSTEM READY
    </div>

    <div id="result">
        Awaiting command.
    </div>


    <div class="controls">

        <button
            class="primary"
            onclick="startVoice()">

            🎙 START VOICE

        </button>


        <button
            onclick="stopVoice()">

            ■ STOP

        </button>


        <button
            onclick="runTyped()">

            EXECUTE

        </button>

    </div>


    <div
        style="
        max-width:720px;
        margin:25px auto 0;
        width:100%;
        ">

        <input
            id="commandInput"
            type="text"
            placeholder="Type a command, then press ENTER...">

    </div>

</section>


<!-- SIDE PANEL -->

<aside class="panel">

    <h2>
        VOICE SYSTEM
    </h2>


    <div class="field">

        <label>
            JARVIS VOICE
        </label>

        <select id="voiceSelect"></select>

    </div>


    <div class="field">

        <label>
            SPEECH RATE
        </label>

        <input
            id="rate"
            type="range"
            min=".5"
            max="1.3"
            step=".05"
            value=".88">

    </div>


    <div class="field">

        <label>
            VOICE PITCH
        </label>

        <input
            id="pitch"
            type="range"
            min=".4"
            max="1.3"
            step=".05"
            value=".65">

    </div>


    <button
        onclick="testVoice()"
        style="width:100%;margin-bottom:20px">

        TEST VOICE

    </button>


    <h2>
        ACTIVITY LOG
    </h2>


    <div
        class="log"
        id="log">
    </div>


    <div class="small">

        Voice recognition uses the browser's
        Web Speech API. Available voices depend
        on the device and browser.

    </div>

</aside>

</div>
</div>


<script>

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

let voices = [];

let listening = false;


const statusEl =
    document.getElementById("status");

const resultEl =
    document.getElementById("result");

const input =
    document.getElementById("commandInput");

const voiceSelect =
    document.getElementById("voiceSelect");

const mainPanel =
    document.getElementById("mainPanel");

const logEl =
    document.getElementById("log");


/* ACTIVITY LOG */

function log(type, text) {

    const d = document.createElement("div");

    d.className = type;

    if(type === "you") {

        d.textContent =
            "YOU: " + text;

    }

    else if(type === "jarvis") {

        d.textContent =
            "JARVIS: " + text;

    }

    else {

        d.textContent =
            "SYSTEM: " + text;

    }

    logEl.prepend(d);
}


/* LOAD VOICES */

function populateVoices() {

    voices =
        speechSynthesis.getVoices();

    voiceSelect.innerHTML = "";

    voices.forEach((voice, index) => {

        const option =
            document.createElement("option");

        option.value = index;

        option.textContent =
            voice.name +
            " — " +
            voice.lang +
            (voice.default
                ? " (DEFAULT)"
                : "");

        voiceSelect.appendChild(option);

    });


    /*
       Try to select an English male
       voice if the device provides one.
    */

    const preferred =
        voices.findIndex(voice =>
            /en-US|en-GB/i.test(voice.lang) &&
            /Daniel|Alex|Google UK English Male|Microsoft David|Microsoft Mark|Fred/i.test(voice.name)
        );


    if(preferred >= 0) {

        voiceSelect.value =
            preferred;

    }

}


/*
   Some browsers load voices
   asynchronously.
*/

speechSynthesis.onvoiceschanged =
    populateVoices;

populateVoices();


/* SPEAK */

function speak(text) {

    if(!("speechSynthesis" in window))
        return;

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);


    const selected =
        voices[
            Number(voiceSelect.value)
        ];


    if(selected) {

        utterance.voice =
            selected;

    }


    utterance.rate =
        Number(
            document.getElementById("rate").value
        );


    utterance.pitch =
        Number(
            document.getElementById("pitch").value
        );


    utterance.volume = 1;


    speechSynthesis.speak(
        utterance
    );
}


/* TEST VOICE */

function testVoice() {

    const text =
        "Good evening. JARVIS systems are online. How may I assist you?";

    resultEl.textContent =
        text;

    log(
        "jarvis",
        text
    );

    speak(text);
}


/* SPEECH RECOGNITION */

if(SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.maxAlternatives = 1;

    recognition.lang = "en-US";


    recognition.onstart = () => {

        listening = true;

        mainPanel.classList.add(
            "listening"
        );

        statusEl.textContent =
            "LISTENING...";

        resultEl.textContent =
            "I'm listening.";

    };


    recognition.onresult =
        (event) => {

            const text =
                event.results[0][0]
                    .transcript
                    .trim();

            input.value =
                text;

            resultEl.textContent =
                "YOU: " + text;

            log(
                "you",
                text
            );

            runCommand(text);

        };


    recognition.onerror =
        (event) => {

            statusEl.textContent =
                "VOICE ERROR";

            resultEl.textContent =
                "Voice error: " +
                event.error;

            log(
                "sys",
                "Voice error: " +
                event.error
            );

        };


    recognition.onend =
        () => {

            listening = false;

            mainPanel.classList.remove(
                "listening"
            );

            statusEl.textContent =
                "SYSTEM READY";

        };

}
else {

    statusEl.textContent =
        "VOICE NOT SUPPORTED";

    resultEl.textContent =
        "Speech recognition is not available in this browser.";

}


/* START VOICE */

function startVoice() {

    if(!recognition) {

        resultEl.textContent =
            "Speech recognition is not available.";

        return;

    }


    if(listening)
        return;


    try {

        recognition.start();

    }

    catch(error) {

        console.log(error);

    }

}


/* STOP */

function stopVoice() {

    if(recognition)
        recognition.stop();

    speechSynthesis.cancel();

    statusEl.textContent =
        "SYSTEM READY";

}


/* ENTER KEY */

input.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter") {

            runTyped();

        }

    }
);


/* TYPED COMMAND */

function runTyped() {

    const text =
        input.value.trim();

    if(text)
        runCommand(text);

}


/* REMOVE "JARVIS" */

function cleanWakeWord(text) {

    return text.replace(
        /^(hey\s+)?jarvis[\s,.:;-]*/i,
        ""
    ).trim();

}


/* COMMAND ENGINE */

function runCommand(original) {

    const command =
        cleanWakeWord(original);

    const lower =
        command.toLowerCase();


    if(!command) {

        speak("Yes?");

        return;

    }


    /* GREETING */

    if(
        lower === "hello" ||
        lower.includes("hello jarvis") ||
        lower === "hi" ||
        lower === "hey"
    ) {

        respond(
            "Good evening. JARVIS systems are online. How may I assist you?"
        );

        return;

    }


    /* IDENTITY */

    if(
        lower.includes("who are you") ||
        lower.includes("what are you")
    ) {

        respond(
            "I am JARVIS, your browser-based artificial intelligence assistant."
        );

        return;

    }


    /* TIME */

    if(
        lower.includes("what time") ||
        lower === "time"
    ) {

        respond(
            "The current time is " +
            new Date().toLocaleTimeString()
        );

        return;

    }


    /* DATE */

    if(
        lower.includes("what date") ||
        lower.includes("what day") ||
        lower === "date"
    ) {

        respond(
            "Today's date is " +
            new Date().toLocaleDateString()
        );

        return;

    }


    /* STATUS */

    if(
        lower === "status" ||
        lower.includes("system status") ||
        lower.includes("systems status")
    ) {

        respond(
            "All primary browser systems are operational."
        );

        return;

    }


    /* HELP */

    if(
        lower === "help" ||
        lower.includes("what can you do")
    ) {

        respond(
            "I can tell you the time and date, search the web, open supported sites, and speak my responses."
        );

        return;

    }


    /* THANKS */

    if(
        lower.includes("thank you") ||
        lower.includes("thanks")
    ) {

        respond(
            "You're welcome. Always a pleasure to assist."
        );

        return;

    }


    /* GOOGLE SEARCH */

    if(
        lower.startsWith("search for ")
    ) {

        const query =
            command
            .substring(11)
            .trim();

        respond(
            "Searching for " +
            query +
            "."
        );

        openURL(
            "https://www.google.com/search?q=" +
            encodeURIComponent(query)
        );

        return;

    }


    /* GOOGLE SEARCH SHORTCUT */

    if(
        lower.startsWith("google ")
    ) {

        const query =
            command
            .substring(7)
            .trim();

        respond(
            "Searching Google for " +
            query +
            "."
        );

        openURL(
            "https://www.google.com/search?q=" +
            encodeURIComponent(query)
        );

        return;

    }


    /* WEBSITE COMMANDS */

    const sites = [

        [
            "youtube",
            "https://www.youtube.com",
            "YouTube"
        ],

        [
            "google",
            "https://www.google.com",
            "Google"
        ],

        [
            "gmail",
            "https://mail.google.com",
            "Gmail"
        ],

        [
            "google drive",
            "https://drive.google.com",
            "Google Drive"
        ],

        [
            "drive",
            "https://drive.google.com",
            "Google Drive"
        ],

        [
            "apps script",
            "https://script.google.com",
            "Google Apps Script"
        ],

        [
            "github",
            "https://github.com",
            "GitHub"
        ]

    ];


    for(
        const [key,url,name]
        of sites
    ) {

        if(
            lower === "open " + key ||
            lower === key
        ) {

            respond(
                "Opening " +
                name +
                "."
            );

            openURL(url);

            return;

        }

    }


    /* STOP */

    if(
        lower === "stop" ||
        lower === "stop speaking"
    ) {

        speechSynthesis.cancel();

        statusEl.textContent =
            "SYSTEM READY";

        resultEl.textContent =
            "Speech stopped.";

        return;

    }


    /* UNKNOWN */

    respond(
        "I heard you say: " +
        command +
        ". I don't have an action for that command yet."
    );

}


/* RESPONSE */

function respond(text) {

    statusEl.textContent =
        "COMMAND COMPLETE";

    resultEl.textContent =
        text;

    log(
        "jarvis",
        text
    );

    speak(text);


    setTimeout(
        () => {
            statusEl.textContent =
                "SYSTEM READY";
        },
        1800
    );

}


/* OPEN WEBSITE */

function openURL(url) {

    const newTab =
        window.open(
            url,
            "_blank"
        );


    if(!newTab) {

        resultEl.textContent =
            "The browser blocked the new tab. Allow pop-ups for this site, then try again.";

        log(
            "sys",
            "Popup blocked."
        );

    }

}

</script>

</body>
</html>
