<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>JARVIS</title>

<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background:
    radial-gradient(
      circle at center,
      #220000 0%,
      #080000 35%,
      #000000 75%
    );

  color: #ff2020;

  font-family:
    "Courier New",
    Courier,
    monospace;
}

body {
  user-select: none;
}


/* =====================================================
   SCANLINES
===================================================== */

body::before {
  content: "";

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: 9999;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255, 0, 0, 0.025) 0px,
      rgba(255, 0, 0, 0.025) 1px,
      transparent 1px,
      transparent 4px
    );
}


/* =====================================================
   MAIN HUD
===================================================== */

#app {
  width: 100%;
  height: 100%;

  position: relative;

  overflow: hidden;
}


/* =====================================================
   TOP BAR
===================================================== */

#topBar {
  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height: 70px;

  border-bottom:
    1px solid rgba(255, 0, 0, 0.5);

  background:
    linear-gradient(
      to bottom,
      rgba(50, 0, 0, 0.8),
      rgba(10, 0, 0, 0.2)
    );

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding:
    0 24px;

  z-index: 20;
}

#logo {
  font-size: 26px;

  font-weight: bold;

  letter-spacing: 6px;

  text-shadow:
    0 0 10px red,
    0 0 20px rgba(255, 0, 0, 0.7);
}

#systemStatus {
  font-size: 12px;

  letter-spacing: 2px;

  opacity: 0.8;
}


/* =====================================================
   CENTER REACTOR
===================================================== */

#center {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  width: min(430px, 70vw);
  height: min(430px, 70vw);

  display: flex;

  align-items: center;

  justify-content: center;
}

#reactor {
  width: 220px;
  height: 220px;

  border-radius: 50%;

  border:
    2px solid rgba(255, 30, 30, 0.8);

  box-shadow:
    0 0 15px red,
    inset 0 0 30px rgba(255, 0, 0, 0.6);

  position: relative;

  animation:
    reactorPulse 3s infinite ease-in-out;
}

#reactor::before {
  content: "";

  position: absolute;

  inset: 25px;

  border-radius: 50%;

  border:
    1px solid rgba(255, 80, 80, 0.8);

  box-shadow:
    0 0 25px rgba(255, 0, 0, 0.8);

  animation:
    reactorSpin 12s linear infinite;
}

#reactor::after {
  content: "";

  position: absolute;

  inset: 65px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      #ff3030 0%,
      #aa0000 35%,
      #330000 70%,
      transparent 72%
    );

  box-shadow:
    0 0 35px red,
    0 0 70px rgba(255, 0, 0, 0.6);
}

@keyframes reactorPulse {

  0%,
  100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.04);
  }
}

@keyframes reactorSpin {

  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}


/* =====================================================
   STATUS TEXT
===================================================== */

#statusText {
  position: absolute;

  bottom: 25px;

  left: 50%;

  transform:
    translateX(-50%);

  font-size: 13px;

  letter-spacing: 3px;

  text-align: center;

  text-shadow:
    0 0 10px red;
}


/* =====================================================
   SIDE PANELS
===================================================== */

.panel {
  position: absolute;

  top: 95px;

  width: 240px;

  padding: 15px;

  border:
    1px solid rgba(255, 0, 0, 0.35);

  background:
    rgba(15, 0, 0, 0.55);

  box-shadow:
    0 0 20px rgba(255, 0, 0, 0.08);

  z-index: 10;
}

#leftPanel {
  left: 18px;
}

#rightPanel {
  right: 18px;
}

.panelTitle {
  font-size: 11px;

  letter-spacing: 3px;

  margin-bottom: 14px;

  color: #ff5555;
}

.telemetry {
  display: flex;

  justify-content: space-between;

  margin:
    9px 0;

  font-size: 11px;
}

.telemetry span:last-child {
  color: #ff7777;
}


/* =====================================================
   CONSOLE
===================================================== */

#console {
  position: absolute;

  left: 20px;
  right: 20px;

  bottom: 70px;

  height: 145px;

  border:
    1px solid rgba(255, 0, 0, 0.35);

  background:
    rgba(0, 0, 0, 0.72);

  padding: 12px;

  overflow-y: auto;

  font-size: 11px;

  line-height: 1.5;

  z-index: 15;
}

.consoleLine {
  margin-bottom: 5px;
}

.userLine {
  color: #ff5555;
}

.jarvisLine {
  color: #ff9999;
}


/* =====================================================
   INPUT
===================================================== */

#inputArea {
  position: absolute;

  bottom: 15px;

  left: 20px;
  right: 20px;

  display: flex;

  gap: 10px;

  z-index: 30;
}

#commandInput {
  flex: 1;

  background:
    rgba(20, 0, 0, 0.85);

  border:
    1px solid rgba(255, 0, 0, 0.5);

  outline: none;

  color: #ff4444;

  padding:
    12px;

  font-family:
    "Courier New",
    monospace;

  font-size: 14px;
}

#commandInput::placeholder {
  color: rgba(255, 70, 70, 0.4);
}

button {
  background:
    rgba(100, 0, 0, 0.35);

  border:
    1px solid rgba(255, 0, 0, 0.6);

  color: #ff5555;

  padding:
    10px 18px;

  font-family:
    "Courier New",
    monospace;

  cursor: pointer;

  transition: 0.2s;
}

button:hover {
  background:
    rgba(180, 0, 0, 0.35);

  box-shadow:
    0 0 15px rgba(255, 0, 0, 0.4);
}


/* =====================================================
   BOOT SCREEN
===================================================== */

#bootScreen {
  position: fixed;

  inset: 0;

  background:
    #000;

  z-index: 10000;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;
}

#bootTitle {
  font-size:
    clamp(32px, 8vw, 80px);

  letter-spacing:
    15px;

  text-shadow:
    0 0 10px red,
    0 0 35px red;

  margin-bottom:
    30px;
}

#bootText {
  font-size: 12px;

  letter-spacing: 2px;

  opacity: 0.7;

  margin-bottom:
    25px;
}

#bootButton {
  padding:
    14px 35px;

  font-size:
    13px;

  letter-spacing:
    3px;
}


/* =====================================================
   SETTINGS
===================================================== */

#settingsButton {
  position: absolute;

  right: 20px;

  bottom: 225px;

  z-index: 40;

  padding:
    8px 12px;

  font-size:
    10px;
}

#settings {
  position: fixed;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%);

  width:
    min(390px, 90vw);

  max-height:
    80vh;

  overflow-y:
    auto;

  background:
    rgba(10, 0, 0, 0.97);

  border:
    1px solid red;

  box-shadow:
    0 0 35px rgba(255, 0, 0, 0.3);

  padding:
    25px;

  z-index: 500;

  display: none;
}

#settings.show {
  display: block;
}

.settingsTitle {
  font-size: 18px;

  letter-spacing: 4px;

  margin-bottom: 25px;
}

.setting {
  margin-bottom: 22px;
}

.setting label {
  display: block;

  font-size: 11px;

  letter-spacing: 2px;

  margin-bottom: 8px;
}

select,
input[type="range"] {
  width: 100%;
}

select {
  background:
    #090000;

  color:
    #ff5555;

  border:
    1px solid rgba(255, 0, 0, 0.5);

  padding:
    10px;

  font-family:
    "Courier New",
    monospace;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width: 800px) {

  .panel {
    display: none;
  }

  #console {
    bottom: 75px;
    height: 130px;
  }

  #reactor {
    width: 180px;
    height: 180px;
  }

  #settingsButton {
    bottom: 215px;
  }

  #logo {
    font-size: 18px;
    letter-spacing: 4px;
  }

  #systemStatus {
    font-size: 9px;
  }
}

</style>

</head>


<body>

<div id="bootScreen">

  <div id="bootTitle">
    JARVIS
  </div>

  <div id="bootText">
    INITIALIZING PERSONAL AI SYSTEM...
  </div>

  <button id="bootButton">
    INITIALIZE
  </button>

</div>


<div id="app">

  <div id="topBar">

    <div id="logo">
      JARVIS
    </div>

    <div id="systemStatus">
      SYSTEM ONLINE
    </div>

  </div>


  <div id="leftPanel" class="panel">

    <div class="panelTitle">
      SYSTEM TELEMETRY
    </div>

    <div class="telemetry">
      <span>CORE</span>
      <span id="coreStatus">ONLINE</span>
    </div>

    <div class="telemetry">
      <span>VOICE</span>
      <span id="voiceStatus">READY</span>
    </div>

    <div class="telemetry">
      <span>MIC</span>
      <span id="micStatus">STANDBY</span>
    </div>

    <div class="telemetry">
      <span>AI</span>
      <span id="aiStatus">READY</span>
    </div>

  </div>


  <div id="rightPanel" class="panel">

    <div class="panelTitle">
      USER PROFILE
    </div>

    <div class="telemetry">
      <span>USER</span>
      <span id="userNameDisplay">
        UNKNOWN
      </span>
    </div>

    <div class="telemetry">
      <span>WAKE WORD</span>
      <span>JARVIS</span>
    </div>

    <div class="telemetry">
      <span>MODE</span>
      <span>VOICE</span>
    </div>

  </div>


  <div id="center">

    <div id="reactor"></div>

  </div>


  <div id="statusText">
    AWAITING COMMAND
  </div>


  <div id="console"></div>


  <div id="inputArea">

    <input
      id="commandInput"
      type="text"
      placeholder="ENTER COMMAND..."
      autocomplete="off"
    >

    <button id="sendButton">
      SEND
    </button>

  </div>


  <button id="settingsButton">
    SETTINGS
  </button>


  <div id="settings">

    <div class="settingsTitle">
      VOICE SETTINGS
    </div>


    <div class="setting">

      <label>
        VOICE
      </label>

      <select id="voiceSelect"></select>

    </div>


    <div class="setting">

      <label>
        SPEECH SPEED:
        <span id="rateValue">0.95</span>
      </label>

      <input
        id="rateSlider"
        type="range"
        min="0.7"
        max="1.3"
        step="0.01"
        value="0.95"
      >

    </div>


    <div class="setting">

      <label>
        PITCH:
        <span id="pitchValue">0.85</span>
      </label>

      <input
        id="pitchSlider"
        type="range"
        min="0.5"
        max="1.2"
        step="0.01"
        value="0.85"
      >

    </div>


    <button id="testVoiceButton">
      TEST VOICE
    </button>

    <button id="closeSettingsButton">
      CLOSE
    </button>

  </div>

</div>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/a/macros/students.katyisd.org/s/AKfycbzhkEbxBKBW1BLVnR0IkTbl0kE8xu8c0YQnKbKlLBRfypDRmP8-R-iJ2U66d2CGWHAJvQ/exec";


/* =====================================================
   ELEMENTS
===================================================== */

const bootScreen =
document.getElementById("bootScreen");

const bootButton =
document.getElementById("bootButton");

const commandInput =
document.getElementById("commandInput");

const sendButton =
document.getElementById("sendButton");

const consoleBox =
document.getElementById("console");

const statusText =
document.getElementById("statusText");

const micStatus =
document.getElementById("micStatus");

const voiceStatus =
document.getElementById("voiceStatus");

const aiStatus =
document.getElementById("aiStatus");

const userNameDisplay =
document.getElementById("userNameDisplay");

const settings =
document.getElementById("settings");

const settingsButton =
document.getElementById("settingsButton");

const closeSettingsButton =
document.getElementById("closeSettingsButton");

const testVoiceButton =
document.getElementById("testVoiceButton");

const voiceSelect =
document.getElementById("voiceSelect");

const rateSlider =
document.getElementById("rateSlider");

const pitchSlider =
document.getElementById("pitchSlider");

const rateValue =
document.getElementById("rateValue");

const pitchValue =
document.getElementById("pitchValue");


/* =====================================================
   USER NAME
===================================================== */

let userName =
localStorage.getItem("jarvisUserName");

if (!userName) {

  userName =
    prompt(
      "JARVIS: What should I call you?"
    );

  if (!userName) {
    userName = "Sir";
  }

  localStorage.setItem(
    "jarvisUserName",
    userName
  );
}

userNameDisplay.textContent =
userName.toUpperCase();


/* =====================================================
   LOGGING
===================================================== */

function logMessage(text, type) {

  const line =
    document.createElement("div");

  line.className =
    "consoleLine " +
    (type === "user"
      ? "userLine"
      : "jarvisLine");

  if (type === "user") {

    line.textContent =
      "YOU > " + text;

  } else {

    line.textContent =
      "JARVIS > " + text;

  }

  consoleBox.appendChild(line);

  consoleBox.scrollTop =
    consoleBox.scrollHeight;
}


/* =====================================================
   STATUS
===================================================== */

function setStatus(text) {

  statusText.textContent =
    text.toUpperCase();
}


/* =====================================================
   VOICE SYSTEM
===================================================== */

let availableVoices = [];

let selectedVoice = null;

let speaking = false;


/*
 * These names generally correspond to voices that are
 * more natural on common Apple, Microsoft, Google and
 * Chromium systems.
 *
 * Availability depends entirely on the device/browser.
 */

const preferredVoicePatterns = [

  "Microsoft Aria",

  "Microsoft Jenny",

  "Microsoft Guy",

  "Microsoft Sonia",

  "Microsoft Libby",

  "Microsoft Ryan",

  "Microsoft Ava",

  "Microsoft Andrew",

  "Microsoft Brian",

  "Microsoft Christopher",

  "Microsoft Zira",

  "Google US English",

  "Google English",

  "Samantha",

  "Alex",

  "Daniel",

  "Karen",

  "Moira",

  "Ava",

  "Allison",

  "Tom"

];


function getVoices() {

  if (!("speechSynthesis" in window)) {
    return [];
  }

  return speechSynthesis
    .getVoices()
    .filter(v => v.lang &&
      /^en(-|_)/i.test(v.lang));
}


/*
 * Score voices so JARVIS automatically chooses a
 * relatively natural English voice when possible.
 */

function scoreVoice(voice) {

  const name =
    voice.name.toLowerCase();

  const lang =
    voice.lang.toLowerCase();

  let score = 0;


  if (lang === "en-us") {
    score += 30;
  }

  if (lang.startsWith("en-us")) {
    score += 20;
  }


  preferredVoicePatterns.forEach(
    pattern => {

      if (
        name.includes(
          pattern.toLowerCase()
        )
      ) {
        score += 100;
      }

    }
  );


  const positiveTerms = [
    "natural",
    "neural",
    "premium",
    "enhanced",
    "enhanced",
    "aria",
    "jenny",
    "guy",
    "ava",
    "samantha",
    "alex",
    "daniel",
    "allison",
    "microsoft",
    "google"
  ];


  positiveTerms.forEach(term => {

    if (name.includes(term)) {
      score += 15;
    }

  });


  /*
   * Avoid voices that commonly sound robotic when
   * better alternatives exist.
   */

  const negativeTerms = [
    "espeak",
    "festival",
    "robot",
    "compact"
  ];

  negativeTerms.forEach(term => {

    if (name.includes(term)) {
      score -= 50;
    }

  });


  return score;
}


function populateVoices() {

  availableVoices =
    getVoices();


  voiceSelect.innerHTML = "";


  if (!availableVoices.length) {

    const option =
      document.createElement("option");

    option.textContent =
      "No English voices available";

    option.value = "";

    voiceSelect.appendChild(option);

    voiceStatus.textContent =
      "NO VOICES";

    return;
  }


  /*
   * Sort the voices by quality score.
   */

  availableVoices.sort(
    (a, b) =>
      scoreVoice(b) -
      scoreVoice(a)
  );


  availableVoices.forEach(
    (voice, index) => {

      const option =
        document.createElement("option");

      option.value =
        index;

      option.textContent =
        voice.name +
        " — " +
        voice.lang;

      voiceSelect.appendChild(option);

    }
  );


  /*
   * Restore previously selected voice.
   */

  const savedVoiceName =
    localStorage.getItem(
      "jarvisVoiceName"
    );


  let chosenIndex = 0;


  if (savedVoiceName) {

    const found =
      availableVoices.findIndex(
        voice =>
          voice.name ===
          savedVoiceName
      );

    if (found >= 0) {
      chosenIndex = found;
    }

  }


  voiceSelect.value =
    chosenIndex;

  selectedVoice =
    availableVoices[chosenIndex];


  voiceStatus.textContent =
    "READY";
}


/*
 * Some browsers don't expose voices immediately.
 */

populateVoices();


if ("speechSynthesis" in window) {

  speechSynthesis.onvoiceschanged =
    populateVoices;

}


voiceSelect.addEventListener(
  "change",
  () => {

    const index =
      parseInt(
        voiceSelect.value
      );

    selectedVoice =
      availableVoices[index];

    if (selectedVoice) {

      localStorage.setItem(
        "jarvisVoiceName",
        selectedVoice.name
      );

    }

  }
);


/* =====================================================
   SPEECH
===================================================== */

function speak(text) {

  return new Promise(resolve => {

    if (
      !("speechSynthesis" in window)
    ) {

      resolve();

      return;
    }


    if (!text) {

      resolve();

      return;
    }


    speechSynthesis.cancel();


    speaking = true;

    voiceStatus.textContent =
      "SPEAKING";

    setStatus(
      "TRANSMITTING VOICE"
    );


    /*
     * Split long responses into natural chunks.
     * This also avoids speechSynthesis bugs on some
     * browsers where long utterances get cut off.
     */

    const chunks =
      splitSpeech(text);


    let current = 0;


    function speakNext() {

      if (current >= chunks.length) {

        speaking = false;

        voiceStatus.textContent =
          "READY";

        setStatus(
          "AWAITING COMMAND"
        );

        resolve();

        return;
      }


      const utterance =
        new SpeechSynthesisUtterance(
          chunks[current]
        );


      utterance.voice =
        selectedVoice || null;


      utterance.rate =
        parseFloat(
          rateSlider.value
        );


      utterance.pitch =
        parseFloat(
          pitchSlider.value
        );


      utterance.volume = 1;


      utterance.onend =
        () => {

          current++;

          setTimeout(
            speakNext,
            80
          );

        };


      utterance.onerror =
        () => {

          current++;

          setTimeout(
            speakNext,
            80
          );

        };


      speechSynthesis.speak(
        utterance
      );

    }


    speakNext();

  });
}


/*
 * Break speech into sentences while preserving a
 * natural speaking rhythm.
 */

function splitSpeech(text) {

  const cleaned =
    text
      .replace(/\s+/g, " ")
      .trim();


  if (cleaned.length < 180) {
    return [cleaned];
  }


  const sentences =
    cleaned.match(
      /[^.!?]+[.!?]+|[^.!?]+$/g
    );


  if (!sentences) {
    return [cleaned];
  }


  const chunks = [];

  let current = "";


  sentences.forEach(sentence => {

    if (
      (current + " " + sentence).length
      > 220
    ) {

      if (current.trim()) {
        chunks.push(
          current.trim()
        );
      }

      current =
        sentence.trim();

    } else {

      current +=
        " " +
        sentence.trim();

    }

  });


  if (current.trim()) {
    chunks.push(
      current.trim()
    );
  }


  return chunks;
}


/* =====================================================
   VOICE CONTROLS
===================================================== */

rateSlider.addEventListener(
  "input",
  () => {

    rateValue.textContent =
      rateSlider.value;

  }
);


pitchSlider.addEventListener(
  "input",
  () => {

    pitchValue.textContent =
      pitchSlider.value;

  }
);


testVoiceButton.addEventListener(
  "click",
  async () => {

    await speak(
      "Good evening. JARVIS systems are online and ready to assist you."
    );

  }
);


/* =====================================================
   SETTINGS
===================================================== */

settingsButton.addEventListener(
  "click",
  () => {

    settings.classList.add("show");

  }
);


closeSettingsButton.addEventListener(
  "click",
  () => {

    settings.classList.remove("show");

  }
);


/* =====================================================
   LOCAL COMMANDS
===================================================== */

function getLocalResponse(message) {

  const text =
    message
      .toLowerCase()
      .trim();


  /*
   * HELLO
   */

  if (
    text === "hello" ||
    text === "hi" ||
    text === "hey"
  ) {

    return {
      handled: true,

      response:
        "Hello, " +
        userName +
        ". How may I assist you?"
    };

  }


  /*
   * TIME
   */

  if (
    text.includes("what time") ||
    text === "time"
  ) {

    const now =
      new Date();

    const time =
      now.toLocaleTimeString(
        [],
        {
          hour: "numeric",
          minute: "2-digit"
        }
      );

    return {
      handled: true,

      response:
        "The current time is " +
        time +
        "."
    };

  }


  /*
   * DATE
   */

  if (
    text.includes("what date") ||
    text === "date" ||
    text.includes("what day")
  ) {

    const now =
      new Date();

    const date =
      now.toLocaleDateString(
        [],
        {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric"
        }
      );

    return {
      handled: true,

      response:
        "Today is " +
        date +
        "."
    };

  }


  /*
   * STATUS
   */

  if (
    text.includes("system status") ||
    text === "status" ||
    text.includes("how are you")
  ) {

    return {
      handled: true,

      response:
        "All primary systems are operational. Voice interface is ready, the neural core is connected, and I am standing by."
    };

  }


  /*
   * WHO ARE YOU
   */

  if (
    text.includes("who are you") ||
    text.includes("what are you")
  ) {

    return {
      handled: true,

      response:
        "I am JARVIS, your personal artificial intelligence assistant."
    };

  }


  /*
   * THANKS
   */

  if (
    text.includes("thank you") ||
    text === "thanks" ||
    text.includes("thank")
  ) {

    return {
      handled: true,

      response:
        "You're welcome."
    };

  }


  /*
   * HELP
   */

  if (
    text === "help" ||
    text.includes("what can you do")
  ) {

    return {
      handled: true,

      response:
        "I can answer questions, control the interface, tell you the time and date, perform searches, and assist you using my AI core."
    };

  }


  /*
   * OPEN YOUTUBE
   */

  if (
    text.includes("open youtube")
  ) {

    window.open(
      "https://www.youtube.com",
      "_blank"
    );

    return {
      handled: true,

      response:
        "Opening YouTube."
    };

  }


  /*
   * OPEN GOOGLE
   */

  if (
    text.includes("open google")
  ) {

    window.open(
      "https://www.google.com",
      "_blank"
    );

    return {
      handled: true,

      response:
        "Opening Google."
    };

  }


  /*
   * OPEN GMAIL
   */

  if (
    text.includes("open gmail")
  ) {

    window.open(
      "https://mail.google.com",
      "_blank"
    );

    return {
      handled: true,

      response:
        "Opening Gmail."
    };

  }


  /*
   * SEARCH
   */

  if (
    text.startsWith("search ")
  ) {

    const query =
      message.substring(7).trim();


    if (query) {

      window.open(
        "https://www.google.com/search?q=" +
        encodeURIComponent(query),
        "_blank"
      );

      return {
        handled: true,

        response:
          "Searching Google for " +
          query +
          "."
      };

    }

  }


  return {
    handled: false
  };
}


/* =====================================================
   AI REQUEST
===================================================== */

function askJarvisAI(message) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        "jarvisCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      let finished = false;


      const script =
        document.createElement(
          "script"
        );


      const timeout =
        setTimeout(
          () => {

            if (finished) {
              return;
            }

            finished = true;

            cleanup();

            reject(
              new Error(
                "AI request timed out."
              )
            );

          },
          20000
        );


      function cleanup() {

        clearTimeout(timeout);

        try {
          delete window[
            callbackName
          ];
        } catch (e) {}

        if (script.parentNode) {
          script.parentNode.removeChild(
            script
          );
        }

      }


      window[callbackName] =
        function(data) {

          if (finished) {
            return;
          }

          finished = true;

          cleanup();


          if (
            data &&
            data.response
          ) {

            resolve(
              data.response
            );

          } else {

            reject(
              new Error(
                "Invalid AI response."
              )
            );

          }

        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }

          finished = true;

          cleanup();

          reject(
            new Error(
              "Could not connect to JARVIS backend."
            )
          );

        };


      script.src =
        APPS_SCRIPT_URL +
        "?callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&message=" +
        encodeURIComponent(
          message
        ) +
        "&name=" +
        encodeURIComponent(
          userName
        );


      document.body.appendChild(
        script
      );

    }
  );
}


/* =====================================================
   AI COMMAND HANDLER
===================================================== */

async function askAI(message) {

  aiStatus.textContent =
    "THINKING";

  setStatus(
    "AI PROCESSING"
  );


  try {

    const response =
      await askJarvisAI(
        message
      );


    aiStatus.textContent =
      "READY";


    logMessage(
      response,
      "jarvis"
    );


    await speak(
      response
    );


  } catch (error) {

    console.error(error);


    aiStatus.textContent =
      "ERROR";


    const response =
      "I'm sorry, " +
      userName +
      ". I couldn't reach my AI core."


    logMessage(
      response,
      "jarvis"
    );


    await speak(
      response
    );

  }


  aiStatus.textContent =
    "READY";

  setStatus(
    "AWAITING COMMAND"
  );
}


/* =====================================================
   COMMAND PROCESSOR
===================================================== */

async function processCommand(
  message
) {

  if (!message) {
    return;
  }


  message =
    message.trim();


  logMessage(
    message,
    "user"
  );


  const local =
    getLocalResponse(
      message
    );


  if (local.handled) {

    logMessage(
      local.response,
      "jarvis"
    );

    await speak(
      local.response
    );

    return;
  }


  await askAI(
    message
  );
}


/* =====================================================
   TEXT INPUT
===================================================== */

async function sendCommand() {

  const message =
    commandInput.value.trim();


  if (!message) {
    return;
  }


  commandInput.value = "";


  await processCommand(
    message
  );
}


sendButton.addEventListener(
  "click",
  sendCommand
);


commandInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      sendCommand();

    }

  }
);


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


let recognition = null;

let recognitionRunning = false;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();


  recognition.continuous =
    true;

  recognition.interimResults =
    false;

  recognition.lang =
    "en-US";


  recognition.onstart =
    () => {

      recognitionRunning =
        true;

      micStatus.textContent =
        "LISTENING";

    };


  recognition.onend =
    () => {

      recognitionRunning =
        false;

      micStatus.textContent =
        "STANDBY";


      /*
       * Keep listening after browser ends the
       * recognition session.
       */

      if (!speaking) {

        setTimeout(
          startRecognition,
          500
        );

      }

    };


  recognition.onerror =
    event => {

      console.log(
        "Recognition error:",
        event.error
      );

      recognitionRunning =
        false;

      micStatus.textContent =
        "ERROR";

    };


  recognition.onresult =
    async event => {

      const result =
        event.results[
          event.results.length - 1
        ];


      if (!result.isFinal) {
        return;
      }


      const transcript =
        result[0]
          .transcript
          .trim();


      if (!transcript) {
        return;
      }


      console.log(
        "Heard:",
        transcript
      );


      if (speaking) {
        return;
      }


      const lower =
        transcript.toLowerCase();


      /*
       * Wake word support
       */

      let command =
        null;


      if (
        lower.startsWith(
          "hey jarvis"
        )
      ) {

        command =
          transcript.substring(
            10
          ).trim();

      } else if (
        lower.startsWith(
          "jarvis"
        )
      ) {

        command =
          transcript.substring(
            6
          ).trim();

      }


      if (command) {

        /*
         * Stop recognition while JARVIS speaks so the
         * microphone doesn't accidentally hear itself.
         */

        stopRecognition();

        await processCommand(
          command
        );

        startRecognition();

      }

    };

}


/* =====================================================
   RECOGNITION CONTROLS
===================================================== */

function startRecognition() {

  if (!recognition) {

    micStatus.textContent =
      "UNSUPPORTED";

    return;

  }


  if (recognitionRunning) {
    return;
  }


  try {

    recognition.start();

  } catch (error) {

    console.log(
      "Recognition start:",
      error
    );

  }

}


function stopRecognition() {

  if (!recognition) {
    return;
  }


  try {

    recognition.stop();

  } catch (error) {}

}


/* =====================================================
   BOOT
===================================================== */

bootButton.addEventListener(
  "click",
  async () => {

    bootScreen.style.display =
      "none";


    setStatus(
      "SYSTEM ONLINE"
    );


    logMessage(
      "JARVIS initialization complete.",
      "jarvis"
    );


    logMessage(
      "Voice interface initialized.",
      "jarvis"
    );


    /*
     * Force the browser to load its voice list.
     */

    if (
      "speechSynthesis" in window
    ) {

      speechSynthesis.getVoices();

      setTimeout(
        populateVoices,
        300
      );

    }


    /*
     * Small welcome message.
     */

    await speak(
      "JARVIS systems online. Good evening, " +
      userName +
      "."
    );


    /*
     * Start microphone after user interaction.
     * This is important because mobile browsers often
     * block microphone access before a user taps something.
     */

    startRecognition();

  }
);


/* =====================================================
   INITIAL CONSOLE
===================================================== */

logMessage(
  "Awaiting system initialization...",
  "jarvis"
);
